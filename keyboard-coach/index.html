  <div class="card"><div class="eyebrow">Next</div><h3>Your shul's songs</h3><p>Send me the names of songs Nishmas Mishkafayim sings most often, or a short recording. I'll add chord charts here in the same format, matched to their key.</p></div></div>`}

/* ---------- why it works (theory) ---------- */
/* demo steps: each step is an array of note names played together */
function demo(steps,gap){const a=ac();if(!a)return;let t=a.currentTime+.05;steps.forEach(s=>{s.forEach(n=>tone(midi(n),t,gap*1.2,.11));t+=gap})}
const K=(arr,f,h)=>arr.map((n,i)=>({n,f:f?f[i]:'',h:h||'r'}));
const WHY=[
 {t:'1. The keyboard is a ladder of half steps',
  p:["Every key, black or white, is one <b>half step</b> higher than the key before it. Skip one key and that's a <b>whole step</b>. The pattern of 12 keys repeats all the way up the keyboard.",
     "Everything else in music is counting these steps. The black keys exist to fill in the half steps between some of the white keys."],
  k:K(['C4','C#4','D4'],null,'m'),
  d:[['Hear C, C♯, D (half steps)',[['C4'],['C#4'],['D4']],.6],['Hear C, D, E (whole steps)',[['C4'],['D4'],['E4']],.6]]},
 {t:'2. A key is a family of 7 notes',
  p:["A song doesn't use all 12 notes. It picks a family of 7 and mostly stays inside it. That family is the song's <b>key</b>.",
     "<b>C major</b> is the white keys with C as home. <b>A minor</b> uses the exact same white keys, but A is home. Same notes, different home, different mood. That's why Am shows up in songs in C, and why C, G and F show up in songs in Am, like Hashivenu."],
  k:K(['C4','D4','E4','F4','G4','A4','B4']),
  d:[['Hear C major (home = C)',[['C4'],['D4'],['E4'],['F4'],['G4'],['A4'],['B4'],['C5']],.4],['Hear A minor (home = A)',[['A3'],['B3'],['C4'],['D4'],['E4'],['F4'],['G4'],['A4']],.4]]},
 {t:'3. How a chord is built: take one, skip one',
  p:["A basic chord is three notes from the key: <b>take a note, skip one, take one, skip one, take one</b>. Start on C: take C, skip D, take E, skip F, take G. That's the C chord: C E G.",
     "Do the same starting on any white key and you get every chord in the key: D F A is Dm, F A C is F, G B D is G, A C E is Am. That's why your hand makes the same 1-3-5 shape for all of them."],
  k:K(['C4','E4','G4'],[1,3,5]),
  d:[['Build C: C, E, G, then together',[['C4'],['E4'],['G4'],['C4','E4','G4']],.6],['Same shape on A = Am',[['A3'],['C4'],['E4'],['A3','C4','E4']],.6]]},
 {t:'4. Major vs minor: the middle note decides',
  p:["Count half steps from the bottom note. <b>Major</b> is 4, then 3: C to E is 4, E to G is 3. It sounds bright. <b>Minor</b> is 3, then 4: A to C is 3, C to E is 4. It sounds darker.",
     "Moving only the middle note by one half step flips a chord between major and minor. C E G is C major. C E♭ G is C minor."],
  k:[{n:'C4',f:1,h:'r'},{n:'D#4',f:'',h:'m'},{n:'E4',f:3,h:'r'},{n:'G4',f:5,h:'r'}],
  d:[['C major, then C minor',[['C4','E4','G4'],['C4','D#4','G4']],1.2],['A minor, then A major',[['A3','C4','E4'],['A3','C#4','E4']],1.2]]},
 {t:'5. Why the E chord is major in Jewish tunes',
  p:["Build a chord on E using only A minor's white keys and you get E G B: E <b>minor</b>. It sounds soft and doesn't push anywhere.",
     "Raise the G to <b>G♯</b> and two things happen. G♯ is only a half step below A, so your ear expects it to step up into A, and the song wants to resolve home to Am. And the jump from F up to G♯ (three half steps) is the sound you hear all over Jewish and Middle Eastern music. That's why E → Am sounds like the end of a line at shul."],
  k:[{n:'E4',f:'',h:'r'},{n:'G#4',f:'',h:'m'},{n:'A4',f:'',h:'l'},{n:'B4',f:'',h:'r'}],
  d:[['Em → Am (weak ending)',[['E3','G3','B3'],['A3','C4','E4']],1.2],['E → Am (strong pull home)',[['E3','G#3','B3'],['A3','C4','E4']],1.2],['The Jewish sound: E F G♯ A',[['E4'],['F4'],['G#4'],['A4']],.5]]},
 {t:'6. Why a chord fits a melody note',
  p:["On a strong beat, the melody note is almost always one of the chord's three notes. If the chord contains it, they blend. If not, they rub against each other.",
     "That's the idea behind the Find the chord tab, and it's how you'll figure out chords by ear: hold the melody note, try chords, keep the one that contains it."],
  k:K(['F4'],null,'m'),
  d:[['Melody F over Dm (D F A): blends',[['D3','A3','D4','F4']],1.6],['Melody F over E (E G♯ B): rubs',[['E3','G#3','B3','F4']],1.6]]},
 {t:'7. Why the smooth shapes work',
  p:["Chords next to each other usually <b>share notes</b>. C (C E G) and Am (A C E) share C and E. So instead of jumping your hand, keep the shared notes down and move only the one that changes, by the smallest step.",
     "It sounds smoother, and your hand barely moves, so you can change chords faster."],
  k:[{n:'C4',f:1,h:'r'},{n:'E4',f:2,h:'r'},{n:'G4',f:'',h:'m'},{n:'A4',f:5,h:'r'}],
  d:[['Jumping: C → Am, root position',[['C4','E4','G4'],['A3','C4','E4']],1.1],['Smooth: only G moves up to A',[['C4','E4','G4'],['C4','E4','A4']],1.1]]},
 {t:'8. Why Transpose works',
  p:["A song is really a pattern of distances: how many half steps between each note and chord. Move <b>every</b> note up the same number of half steps and all the distances stay the same, so it's still the same song, just higher.",
     "That's all Transpose does. You keep playing A minor shapes. +5 shifts every note up 5 half steps, so it comes out in D minor."],
  k:[{n:'A3',f:'',h:'r'},{n:'D4',f:'',h:'m'}],
  d:[['Am → Dm → E → Am',[['A3','C4','E4'],['A3','D4','F4'],['G#3','B3','E4'],['A3','C4','E4']],.9],['Same thing +5 (D minor)',[['D4','F4','A4'],['D4','G4','A#4'],['C#4','E4','A4'],['D4','F4','A4']],.9]]},
 {t:'9. Why fingering matters',
  p:["Your 5 fingers can cover 5 neighboring keys without your hand moving. Skip the pinky and you only cover 4, so your hand keeps jumping. That's what makes fast melodies and smooth chord changes hard.",
     "Using all five, with the pinky on the top note of chords, means less jumping, fewer wrong notes and more speed. The five-finger exercises train exactly that."],
  k:K(['C4','D4','E4','F4','G4'],[1,2,3,4,5]),
  d:[['Five fingers, five keys, no jumping',[['C4'],['D4'],['E4'],['F4'],['G4'],['F4'],['E4'],['D4'],['C4']],.4]]}
];
function renderWhy(){const el=document.getElementById('tab-why');
  el.innerHTML=`<div class="stack"><div><h2>Why it works</h2><p class="note" style="margin-top:6px">The theory behind everything in your lessons, in plain words. Tap the buttons to hear each idea.</p></div>${WHY.map((w,i)=>`<article class="card"><h3>${w.t}</h3><div class="body">${w.p.map(x=>`<p>${x}</p>`).join('')}</div><div class="kb" style="margin-top:8px">${keyboard(w.k)}</div><div class="walknav">${w.d.map((d,j)=>`<button class="btn small" data-w="${i}-${j}">▶ ${d[0]}</button>`).join('')}</div></article>`).join('')}</div>`;
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.w.split('-').map(Number);const d=WHY[i].d[j];demo(d[1],d[2])})}

/* ---------- tabs & toast ---------- */
function show(tab){document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  ['lesson','chords','fit','songs','why'].forEach(t=>document.getElementById('tab-'+t).hidden=t!==tab);
  ({lesson:renderLesson,chords:renderChords,fit:renderFit,songs:renderSongs,why:renderWhy})[tab]();store.set('bkc-tab',tab);scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
if(!store.get('bkc-t3open',false)){curLesson='t3';save();store.set('bkc-t3open',true)}
if(!store.get('bkc-s3open',false)){curLesson='s3';save();store.set('bkc-s3open',true)}
if(curLesson==='s1'||curLesson==='s2'){curLesson='s3';save()}
show('lesson');
