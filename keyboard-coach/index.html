<style>

:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#141a2b; --muted:#5b6478; --line:#d9deea;

  --lh:#7a3fb0; --lh-soft:#efe4f8;

  --ok:#1d7a4c; --bad:#b4372b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --ink:#e9edf7; --muted:#a3acc2; --line:#29324b;
  --accent:#7fa6f0; --accent-ink:#0b1020; --accent-soft:#1d2a4a;
  --gold:#f0b546; --gold-soft:#3a2e14;
  --lh:#c69bf0; --lh-soft:#2f2343;
  --key-white:#e8ebf2; --key-black:#05070d; --key-edge:#5d6782;
  --ok:#5fd19a; --bad:#f08a7e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --ink:#e9edf7; --muted:#a3acc2; --line:#29324b;
  --accent:#7fa6f0; --accent-ink:#0b1020; --accent-soft:#1d2a4a;
  --gold:#f0b546; --gold-soft:#3a2e14;
  --lh:#c69bf0; --lh-soft:#2f2343;
  --key-white:#e8ebf2; --key-black:#05070d; --key-edge:#5d6782;
  --ok:#5fd19a; --bad:#f08a7e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button{font-family:var(--f-body)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.chip .tag.review{background:var(--line);color:var(--muted)}

.lessonhead p{margin:6px 0 0;color:var(--muted)}
.progress{display:flex;gap:4px;margin-top:12px}

.progress span.done{background:var(--ok)}

.stephead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.body{margin-top:10px}
.body p{margin:0 0 10px}

.walkbox h3{font-size:1.6rem}

.walknav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* live keyboard listening */
.midibtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:700 .85rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.midibtn .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.midibtn.on{color:var(--ok);border-color:var(--ok)}.midibtn.on .dot{background:var(--ok)}
.midihelp{margin-top:14px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.midihelp ol{margin:6px 0 0;padding-left:20px}.midihelp p{margin:4px 0}
.heard{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--bg);border:2px solid var(--line);min-height:3.2em}
.heard.good{border-color:var(--ok)}.heard.bad{border-color:var(--bad)}
.heard .what{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.heard .v{font-weight:700}.heard.good .v{color:var(--ok)}.heard.bad .v{color:var(--bad)}

.score{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.92rem}
.score b{font-variant-numeric:tabular-nums}
.copybox{width:100%;margin-top:8px;font:.85rem var(--f-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px}
@media (min-width:860px){
  body{font-size:19px}

<script>
/* ---------- storage (per-device convenience) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- notes ---------- */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midi(n){const m=n.match(/^([A-G]#?)(\d)$/);return NAMES.indexOf(m[1])+12*(+m[2]+1)}
function pc(n){return n.replace(/\d/,'')}
let CUR_SHARP=false;
const SP=s=>(CUR_SHARP?s:s.replace('A#','B♭').replace('D#','E♭')).replace('#','♯');
const isBlack=m=>[1,3,6,8,10].includes(m%12);

/* ---------- chord voicings ---------- */
/* r = right hand [note, finger], l = left hand [note, finger] */
const V={
  C:{r:[['C4',1],['E4',3],['G4',5]],l:[['C3',5]]},
  G:{r:[['G3',1],['B3',3],['D4',5]],l:[['G2',5]]},
  Am:{r:[['A3',1],['C4',3],['E4',5]],l:[['A2',5]]},
  F:{r:[['F3',1],['A3',3],['C4',5]],l:[['F2',5]]},
  /* smooth (close) voicings around middle C */
  Cs:{name:'C',r:[['C4',1],['E4',3],['G4',5]],l:[['C3',5]]},
  Gs:{name:'G',r:[['B3',1],['D4',2],['G4',5]],l:[['G2',5]]},
  Ams:{name:'Am',r:[['C4',1],['E4',2],['A4',5]],l:[['A2',5]]},
  Fs:{name:'F',r:[['C4',1],['F4',3],['A4',5]],l:[['F2',5]]},
  /* Jewish minor family */
  Amm:{name:'Am',r:[['A3',1],['C4',3],['E4',5]],l:[['A2',5]]},
  Dmm:{name:'Dm',r:[['A3',1],['D4',3],['F4',5]],l:[['D3',5]]},
  Em:{name:'E',r:[['G#3',1],['B3',2],['E4',5]],l:[['E3',5]]},
  /* key of G (later) */
  Gg:{name:'G',r:[['B3',1],['D4',2],['G4',5]],l:[['G2',5]]},
  Dg:{name:'D',r:[['A3',1],['D4',3],['F#4',5]],l:[['D3',5]]},
  Emg:{name:'Em',r:[['B3',1],['E4',3],['G4',5]],l:[['E3',5]]},
  /* left-hand chords just below middle C, same spot as piano-style playing (split point raised to the B below middle C) */
  AmL:{name:'Am',r:[],l:[['C3',5],['E3',3],['A3',1]]},
  DmL:{name:'Dm',r:[],l:[['D3',5],['F3',3],['A3',1]]},
  EL:{name:'E',r:[],l:[['B2',5],['E3',3],['G#3',1]]},
  Cg:{name:'C',r:[['C4',1],['E4',3],['G4',5]],l:[['C3',5]]},
  /* G minor family, left hand: same shapes as Am/Dm/E, two keys lower */
  GmL:{name:'Gm',r:[],l:[['A#2',5],['D3',3],['G3',1]]},
  /* plain stacked shapes for the 'what makes a chord' step */
  GO:{name:'G',r:[],l:[['G2',5],['B2',3],['D3',1]]},
  GmO:{name:'Gm',r:[],l:[['G2',5],['A#2',3],['D3',1]]},
  DO:{name:'D',r:[],l:[['D3',5],['F#3',3],['A3',1]]},
  CmL:{name:'Cm',r:[],l:[['C3',5],['D#3',3],['G3',1]]},
  DL:{name:'D',r:[],l:[['A2',5],['D3',3],['F#3',1]]},
  EbL:{name:'E♭',r:[],l:[['A#2',5],['D#3',3],['G3',1]]},
  BbL:{name:'B♭',r:[],l:[['A#2',5],['D3',3],['F3',1]]},
  FL:{name:'F',r:[],l:[['A2',5],['C3',3],['F3',1]]},
  /* A minor family extras (Yiboneh): all one move away from Am or E */
  FaL:{name:'F',r:[],l:[['C3',5],['F3',3],['A3',1]]},
  CL:{name:'C',r:[],l:[['C3',5],['E3',3],['G3',1]]},
  B7L:{name:'B7',sharp:true,r:[],l:[['B2',5],['D#3',3],['A3',1]]},
  /* Acheinu extras */
  EmL:{name:'Em',r:[],l:[['B2',5],['E3',3],['G3',1]]},
  GL:{name:'G',r:[],l:[['B2',5],['D3',3],['G3',1]]},
  EsL:{name:'Esus4',r:[],l:[['B2',5],['E3',3],['A3',1]]},
  BhL:{name:'Bm7♭5',r:[],l:[['B2',5],['D3',4],['F3',2],['A3',1]]},
  /* L'maan Achai extras: 7th chords one finger away from known shapes */
  D7L:{name:'D7',r:[],l:[['A2',5],['C3',3],['F#3',1]]},
  G7L:{name:'G7',r:[],l:[['B2',5],['F3',2],['G3',1]]},
  F7L:{name:'F7',r:[],l:[['A2',5],['D#3',2],['F3',1]]},
  Cm6L:{name:'Cm6',r:[],l:[['A2',5],['C3',3],['D#3',1]]},
};
const nameOf=k=>V[k].name||k;
function notesOf(k){return V[k].r.map(x=>pc(x[0])).join(' – ')}

/* ---------- audio ---------- */
let ctx=null;
function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
let XP=0;
function tone(m,t,dur,vol){const a=ac();if(!a)return;m+=XP;const f=440*Math.pow(2,(m-69)/12);
  const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
  const g2=a.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)}
function playChord(k,at,dur=1.6){const a=ac();if(!a)return;const t=at??a.currentTime+.02;

function copyResults(btn){const t=resultsText();const done=()=>toast('Copied. Paste it to Claude to shape the next lesson.');
  const fallback=()=>{let ta=btn.parentElement.querySelector('textarea');if(!ta){ta=document.createElement('textarea');ta.className='copybox';ta.rows=6;ta.id='copybox';btn.parentElement.appendChild(ta)}ta.value=t;ta.focus();ta.select();toast('Select all and copy this text.')};

let activeAuto=null;
function walker(keys,label,def,opts={}){const id='w'+Math.random().toString(36).slice(2,7);
  let bOk=0,bTot=0,peeks=0,peek=false,auto=false,tmr=null,beats=4,cur=0,sound=store.get('bkc-sound','guitar'),xp=store.get('bkc-xp-'+label,def||0);
  /* listening state */
  let listenOn=store.get('bkc-listen',true),clean=0,total=0,slips=[],dirty=false,settle=null,badT=null,advancedAt=0;
  let bar=null,aTotal=0,aOn=0;
  /* song mode: opts.beats[i] = how many beats chord i lasts; the app waits that long before showing the next chord */
  let hold=null,holdTick=null,holdEnd=0,holdIdx=-1;
  const bandBpm=()=>(BAND.last&&performance.now()-BAND.last<1500&&BAND.bpm)?BAND.bpm:0;
  const bpmNow=()=>bandBpm()||(opts.songBpm?store.get('bkc-songbpm-'+label,opts.songBpm):(metro.bpm||100));
  const clearHold=()=>{clearTimeout(hold);clearInterval(holdTick);hold=null;holdTick=null;holdIdx=-1};
  const holdHTML=()=>{const k=keys[cur],left=Math.max(1,Math.ceil((holdEnd-performance.now())/(60000/bpmNow())));const nx=cur<keys.length-1?nameOf(keys[cur+1]):'the end (back to the top)';
    return `<div class="what"><span class="v">✓ ${nameOf(k)}</span>: keep holding</div><p class="note"><b>${left}</b> beat${left>1?'s':''} left, then <b>${nx}</b>. <span style="opacity:.7">(${bandBpm()?`band at ${bandBpm()} bpm`:`song speed ${bpmNow()} bpm`})</span></p>`};
  const today=()=>new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const slip=t=>{if(!slips.includes(t))slips.push(t)};
  const good=j=>j.state==='perfect'||(j.state==='ok'&&!opts.bridge);
  const closeBar=()=>{if(!bar)return;aTotal++;if(bar.hit&&!bar.late)aOn++;else slip(nameOf(keys[bar.i])+(bar.hit?': changed late':': missed'));bar=null};
  const paintScore=()=>{const el=document.getElementById(id);const sc=el&&el.querySelector('[data-score]');if(!sc)return;
    sc.innerHTML=MID.ok?(auto?`With the band: <b>${aOn} of ${aTotal}</b> changes on time`:`Clean chords this run: <b>${clean} of ${total}</b>`+(bTot?` · On the beat: <b>${bOk} of ${bTot}</b>`:'')+(opts.gate?` · Ready check: <b>${store.get('bkc-streak-'+label,0)} of ${opts.gate}</b> clean in a row`:'')):'';};
  const sub=()=>{const el=document.getElementById(id);if(!el){MID.subs.delete(sub);return}
    const k=keys[cur],j=judge(k,xp),box=el.querySelector('[data-h]');
    const stale=!auto&&advancedAt>0&&j.held.length&&!good(j)&&!j.held.some(m=>(MID.held.get(m)||0)>advancedAt);
    if(box&&hold){box.className='heard good';box.innerHTML=holdHTML()}
    else if(box){if(stale){box.className='heard good';box.innerHTML=`<div class="what"><span class="v">✓ Got it</span></div><p class="note">Keep holding as long as you like. When you're ready, move to <b>${nameOf(k)}</b>.</p>`}
      else if(opts.bridge&&j.state==='ok'){box.className='heard good';box.innerHTML=`<div class="what"><span class="v">✓ That's your old ${nameOf(k)}</span></div><p class="note"><b>Now: ${opts.bridge[k]||''}</b> Keep the other fingers where they are.</p><p class="note">You're holding: ${j.held.map(nn).join(' ')}</p>`}
      else{box.className='heard'+(good(j)?' good':j.state==='bad'?' bad':'');box.innerHTML=heardHTML(j,k)}}
    if(!MID.ok)return;
    if(!el.querySelector('[data-score]')){draw(cur,false,true);return}
    if(auto){if(bar&&!bar.hit&&good(j)){bar.hit=true;bar.late=performance.now()-bar.t>60000/metro.bpm}paintScore();return}
    const fresh=j.held.some(m=>(MID.held.get(m)||0)>advancedAt);
    if(j.state==='bad'&&fresh){if(!badT)badT=setTimeout(()=>{badT=null;const j2=judge(keys[cur],xp);if(j2.state==='bad'){dirty=true;slip(nameOf(keys[cur])+': played '+j2.extra.map(nn).join(' ')+(j2.missing.length?' instead of '+j2.missing.map(nn).join(' '):''))}},450)}
    else{clearTimeout(badT);badT=null}
    if(listenOn&&!hold&&good(j)&&(fresh||!advancedAt)){if(!settle)settle=setTimeout(()=>{settle=null;if(auto||!good(judge(keys[cur],xp)))return;
        total++;const jj=judge(keys[cur],xp);
        if(CUR_STYLE&&BAND.on){const tc=Math.max(...jj.held.map(m=>MID.held.get(m)||0));const bo=beatOff(tc);if(bo){bTot++;if(bo.ticks<=4)bOk++;else slip(`${nameOf(keys[cur])}: changed a little ${bo.early?'before':'after'} the beat`)}}if(jj.state==='ok'){dirty=true;slip(nameOf(keys[cur])+': right notes, old shape')}if(!dirty)clean++;dirty=false;advancedAt=performance.now();
        const go=()=>{if(cur===keys.length-1){logRun({d:today(),label,kind:'steps',clean,total,beat:bTot?`${bOk} of ${bTot}`:null,slips:slips.slice(0,6)});(()=>{if(opts.gate){const sk='bkc-streak-'+label;const st=clean===total?store.get(sk,0)+1:0;store.set(sk,st);
          if(st>=opts.gate){const L=LESSONS.find(l=>l.gate&&l.gate.label===label);if(L&&!store.get('bkc-pass-'+L.id,false)){store.set('bkc-pass-'+L.id,true);sendRun({d:today(),label:'READY CHECK PASSED',kind:'steps',clean:st,total:st,slips:[]})}toast(`✓ ${st} clean in a row. Ready check passed!`)}
          else toast(clean===total?`Clean! ${st} of ${opts.gate} in a row.`:`${clean} of ${total} clean. Streak reset, 0 of ${opts.gate}. Slow down and go again.`)}
        else toast(`Done: ${clean} of ${total} clean.${clean===total?' Perfect run!':' Go again?'}`)})();clean=0;total=0;bOk=0;bTot=0;slips=[];draw(0,false)}
        else draw(cur+1,false)};
        if(opts.beats&&opts.beats[cur]){const n=opts.beats[cur],ms=n*60000/bpmNow();holdIdx=cur;holdEnd=performance.now()+ms;
          hold=setTimeout(()=>{const ok=holdIdx===cur&&document.getElementById(id);clearHold();if(ok)go()},ms);holdTick=setInterval(()=>{const e2=document.getElementById(id);if(!e2){clearHold();return}const bx=e2.querySelector('[data-h]');if(bx&&hold){bx.className='heard good';bx.innerHTML=holdHTML()}},150);sub()}
        else go()},350)}
    else{clearTimeout(settle);settle=null}};
  MID.subs.add(sub);
  const keyName=()=>{const r=midi(V[keys[0]].l[0][0])+xp;return SP(NAMES[((r%12)+12)%12])+(nameOf(keys[0]).endsWith('m')?'m':'')};
  const stop=()=>{if(auto&&MID.ok){closeBar();if(aTotal>=keys.length){logRun({d:today(),label,kind:'auto',ontime:aOn,total:aTotal,slips:slips.slice(0,6)});toast(`With the band: ${aOn} of ${aTotal} changes on time.`)}}
    aTotal=0;aOn=0;bar=null;slips=[];auto=false;clearTimeout(tmr);if(activeAuto===stop)activeAuto=null};
  const tick=i=>{if(!auto)return;closeBar();bar={i,t:performance.now()+30,hit:false,late:false};draw(i,false);if(good(judge(keys[i],xp)))bar.hit=true;const a=ac();if(!a)return;const spb=60/metro.bpm,t0=a.currentTime+.03;
    XP=xp;if(sound==='guitar')strumBar(keys[i],t0,spb,beats);else{playChord(keys[i],t0,spb*beats*.95);for(let b=0;b<beats;b++)click(t0+b*spb,b===0)}XP=0;
    tmr=setTimeout(()=>{if(!auto)return;tick((i+1)%keys.length)},spb*beats*1000)};
  const start=from=>{if(activeAuto)activeAuto();const a=ac();if(!a)return;keepAwake();auto=true;activeAuto=()=>{stop();draw(cur,false)};
    const spb=60/metro.bpm,t0=a.currentTime+.05;for(let b=0;b<4;b++)click(t0+b*spb,b===0);toast('Count-in: 1, 2, 3, 4');draw(from,false);
    tmr=setTimeout(()=>tick(from),spb*4*1000)};
  const draw=(i,play,keepPeek)=>{if(i!==cur)clearHold();CUR_SHARP=!!(V[keys[i]]&&V[keys[i]].sharp);if(!keepPeek)peek=false;if(i!==cur)advancedAt=performance.now();cur=i;const el=document.getElementById(id);if(!el)return;const k=keys[i],nx=keys[i+1];const show=!opts.hide||peek;
    el.innerHTML=`<div class="lbl"><strong>${label}</strong><span class="notes">Chord ${i+1} of ${keys.length}</span></div>
    <div class="chips" style="margin-top:6px">${keys.map((x,j)=>`<button class="chip" data-j="${j}" aria-pressed="${j===i}">${nameOf(x)}</button>`).join('')}</div>
    ${show?`<div class="walkbox"><h3>${nameOf(k)}</h3><p class="hands">${handsText(k)}</p>${i>0?`<p class="hands move">${moveText(keys[i-1],k)}</p>`:''}${rearr(k)}${fingerNote(k)}</div>
    ${keyMap(chordMarks(k))}<div class="kb">${keyboard(chordMarks(k))}</div>${LEGEND}`:`<div class="memory"><div class="big">${nameOf(k)}</div><p class="note">Play it from memory.</p><button class="btn small" data-a="peek">Stuck? Peek at the picture</button><p class="note">Peeks so far: <b>${peeks}</b></p></div>`}
    <div class="heard" data-h></div>
    <div class="walknav"><button class="btn small" data-a="prev" ${i===0?'disabled':''}>◀ Prev chord</button><button class="btn small" data-a="next">${nx?'Next chord: '+nameOf(nx)+' ▶':'Start over ↺'}</button></div>
    <div class="autobar"><button class="btn ${auto?'':'primary'}" data-a="auto">${auto?'■ Stop':'▶ Auto-play'}</button>
     <label class="note">Beats per chord <select data-a="beats">${[2,4,8].map(n=>`<option ${n===beats?'selected':''}>${n}</option>`).join('')}</select></label>
     <label class="note">Sound <select data-a="sound"><option value="guitar" ${sound==='guitar'?'selected':''}>Guitar backing</option><option value="piano" ${sound==='piano'?'selected':''}>Piano + click</option></select></label>
     <span class="keyctl"><span class="note">Sounds in</span><button class="btn small" data-a="kdn" aria-label="Lower key">−</button><b>${keyName()}</b><button class="btn small" data-a="kup" aria-label="Higher key">+</button></span>
     <span class="tempo"><button class="btn small" data-a="slower" aria-label="Slower">−</button><span class="bpm">${metro.bpm} bpm</span><button class="btn small" data-a="faster" aria-label="Faster">+</button></span></div>
    ${MID.ok?`<div class="score"><span data-score></span><button class="btn small" data-a="listen" aria-pressed="${listenOn}">${listenOn?'Auto-advance: on':'Auto-advance: off'}</button></div>`:''}${opts.songBpm?`<p class="note" style="margin-top:8px">Song speed when the band is off: <button class="btn small" data-a="sp-">− 10</button> <b data-sp>${store.get('bkc-songbpm-'+label,opts.songBpm)}</b> bpm <button class="btn small" data-a="sp+">+ 10</button><br>With the band playing, the app follows the band's speed instead.</p>`:''}`;
    if(opts.songBpm){const k='bkc-songbpm-'+label;const set=d=>{const v=Math.min(220,Math.max(60,store.get(k,opts.songBpm)+d));store.set(k,v);const b=el.querySelector('[data-sp]');if(b)b.textContent=v};const m=el.querySelector('[data-a="sp-"]'),pl=el.querySelector('[data-a="sp+"]');if(m)m.onclick=()=>set(-10);if(pl)pl.onclick=()=>set(10)}
    const la=el.querySelector('[data-a=listen]');if(la)la.onclick=()=>{listenOn=!listenOn;store.set('bkc-listen',listenOn);draw(cur,false,true)};
    const cp=el.querySelector('[data-a=copy]');if(cp)cp.onclick=()=>copyResults(cp);
    el.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{stop();draw(+b.dataset.j,true)});
    el.querySelector('[data-a=prev]').onclick=()=>{stop();draw(Math.max(0,i-1),true)};
    el.querySelector('[data-a=next]').onclick=()=>{stop();draw((i+1)%keys.length,true)};
    el.querySelector('[data-a=auto]').onclick=()=>{if(auto){stop();draw(i,false)}else start(i)};
    const pk=el.querySelector('[data-a=peek]');if(pk)pk.onclick=()=>{peeks++;peek=true;draw(cur,false,true)};
    const setKey=d=>{xp=Math.min(6,Math.max(-6,xp+d));store.set('bkc-xp-'+label,xp);draw(cur,true)};
    el.querySelector('[data-a=kdn]').onclick=()=>setKey(-1);el.querySelector('[data-a=kup]').onclick=()=>setKey(1);
    el.querySelector('[data-a=sound]').onchange=e=>{sound=e.target.value;store.set('bkc-sound',sound)};
    el.querySelector('[data-a=beats]').onchange=e=>{beats=+e.target.value;store.set('bkc-beats',beats)};
    const tempo=d=>{metro.bpm=Math.min(140,Math.max(40,metro.bpm+d));store.set('bkc-bpm',metro.bpm);el.querySelector('.tempo .bpm').textContent=metro.bpm+' bpm'};
    el.querySelector('[data-a=slower]').onclick=()=>tempo(-4);el.querySelector('[data-a=faster]').onclick=()=>tempo(4);
    if(play){XP=xp;playChord(k);XP=0}
    paintScore();sub()};
  setTimeout(()=>draw(0,false));return `<div class="diagram walker card" id="${id}"></div>`}
/* ---------- melody follower: the right hand plays the tune, note by note, from the sheet ---------- */
/* song text: "note:beats:finger" tokens (ties already added into beats), "R:beats" = rest, "|" = bar line (ignored, just for reading) */
function parseMel(src,chords,meter=3,start=0,slot=0){slot=slot||meter;const out=[];let pos=start;
  src.trim().split(/\s+/).forEach(t=>{if(t==='|')return;const [n,b,f]=t.split(':');const beats=+b;
    if(n!=='R')out.push({n,beats,f:+f,at:pos,bar:Math.floor(pos/meter)+(start?0:1),chord:chords?(chords[Math.floor(pos/slot)]||null):null});pos+=beats});
  out.total=pos;return out}
const WHITE_I=n=>{const m=midi(n);return Math.floor(m/12)*7+[0,0,1,1,2,3,3,4,4,5,5,6][m%12]};
const upN=(n,up)=>{if(!up)return n;const m=midi(n)+up;return NAMES[m%12]+(Math.floor(m/12)-1)};
function moveTip(p,c,up){if(!p)return '';const semis=midi(c.n)-midi(p.n),fd=c.f-p.f;
  if(semis===0)return p.f===c.f?'':`Same key, new finger: swap to finger ${c.f} so your hand moves into its new spot.`;
  const down=semis<0;
  if(fd===0)return `Move your hand ${down?'down':'up'}: finger ${c.f} plays it again.`;
  if(Math.sign(fd)!==Math.sign(semis)){
    if(down&&p.f===1)return `Cross finger ${c.f} over your thumb.`;
    if(!down&&c.f===1)return `Tuck your thumb under to reach it.`;
    return `Move your hand ${down?'down':'up'} for this one.`}
  const a=Math.abs(semis),f=Math.abs(fd);
  if(a<f||a>f*2+(f>=3?2:1))return `Move your hand ${down?'down':'up'} for this one.`;
  return ''}
function melody(src,label,opts={}){const id='m'+Math.random().toString(36).slice(2,7);
  const N=parseMel(src,opts.chords,opts.meter||3,opts.start||0,opts.slot||0);const U=opts.unit==='eighth'?'count':'beat';const up=opts.up||0,both=!!opts.both,lo=opts.lo??(both?60:52);
  let cur=0,clean=0,miss=false,slips=[],playing=false,flash=null,timers=[];
  const bk='bkc-melbpm-'+label;const bpm=()=>store.get(bk,opts.bpm||70);
  const today=()=>new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const all=N.map(x=>midi(upN(x.n,up)));const lhAll=both?[...new Set(N.map(x=>x.chord).filter(Boolean))].flatMap(k=>V[k].l.map(y=>midi(y[0]))):[];
  const rngLo=Math.min(...all,...lhAll),rngHi=Math.max(...all,...lhAll);
  const marksAt=i=>{const x=N[i];const m=[{n:upN(x.n,up),f:x.f,h:'r'}];if(both&&x.chord)V[x.chord].l.forEach(y=>m.push({n:y[0],f:y[1],h:'l'}));
return m};
  const stopPlay=()=>{timers.forEach(clearTimeout);timers=[];playing=false};
  const finish=()=>{logRun({d:today(),label,kind:'melody',clean,total:N.length,slips:slips.slice(0,6)});
    toast(clean===N.length?`Perfect: all ${N.length} notes right first time!`:`Done: ${clean} of ${N.length} notes right first time. Go again?`);cur=0;clean=0;miss=false;slips=[];draw()};
  const hook=(m,v,on)=>{const el=document.getElementById(id);if(!el){MID.noteHooks.delete(hook);return}if(!on||playing||m<lo)return;
    const x=N[cur],want=midi(x.n);
    if(m%12===want%12){if(!miss)clean++;miss=false;flash={ok:true};cur++;if(cur>=N.length){finish();return}draw()}
    else{if(!miss){miss=true;slips.push(`bar ${x.bar}: ${nn(m)} for ${SP(pc(x.n))}`)}flash={ok:false,m};draw()}};
  MID.noteHooks.add(hook);
  const hear=()=>{if(playing){stopPlay();draw();return}const a=ac();playing=true;const spb=60/bpm(),start=cur;let t=0;const t0=N[start].at;
    const viaKb=MID.acc&&MID.acc.outputs&&MID.acc.outputs.size>0;let lastChord=null;
    N.slice(start).forEach((x,j)=>{const at=(x.at-t0)*spb;const dur=Math.max(.15,x.beats*spb*.92);const mm=midi(upN(x.n,up));
      timers.push(setTimeout(()=>{cur=start+j;draw()},at*1000));
      if(viaKb)midiOut([mm],at,dur);else if(a)tone(mm,a.currentTime+.05+at,dur,.14);
      if(both&&x.chord&&x.chord!==lastChord){lastChord=x.chord;const cm=V[x.chord].l.map(y=>midi(y[0]));
        let end=N.slice(start+j+1).find(y=>y.chord!==x.chord);const cd=((end?end.at:N.total)-x.at)*spb*.95;
        if(viaKb)midiOut(cm,at,cd);else if(a)cm.forEach(c=>tone(c,a.currentTime+.05+at,cd,.08))}});
    const last=N[N.length-1];timers.push(setTimeout(()=>{stopPlay();cur=start;draw()},((last.at+last.beats-t0)*spb+.3)*1000));draw()};
  const draw=()=>{const el=document.getElementById(id);if(!el)return;const x=N[cur],p=N[cur-1];const shown=upN(x.n,up);
    const bars=[];N.forEach((y,i)=>{(bars[y.bar]=bars[y.bar]||[]).push(i)});
    const strip=bars.filter(Boolean).map(b=>`<span class="mbar">${b.map(i=>`<span class="mn${i===cur?' on':i<cur?' past':''}">${SP(pc(N[i].n))}<sub>${N[i].f}</sub></span>`).join('')}</span>`).join('');
    const tip=moveTip(p,x,up);
    let heard='';if(!MID.ok)heard=`<p class="note">Tap <b>Connect keyboard</b> at the top and I'll follow along as you play.</p>`;
    else if(playing)heard=`<div class="what">Listen…</div>`;
    else if(flash&&!flash.ok)heard=`<div class="what"><span class="v">✗ That's ${nn(flash.m)}.</span> You need <b>${SP(pc(x.n))}</b>, finger <b>${x.f}</b>.</div>`;
    else if(flash&&flash.ok)heard=`<div class="what"><span class="v">✓</span> Next: <b>${SP(pc(x.n))}</b>, finger <b>${x.f}</b></div>`;
    else heard=`<div class="what">Play <b>${SP(pc(x.n))}</b> with finger <b>${x.f}</b></div>`;
    el.innerHTML=`<div class="lbl"><strong>${label}</strong><span class="notes">Note ${cur+1} of ${N.length} · ${x.bar?'bar '+x.bar:'pickup'}</span></div>
     ${opts.img?`<img class="sheet" src="${opts.img}" alt="${label}, sheet music">`:''}
     <div class="mstrip" aria-label="Notes with finger numbers">${strip}</div>
     <div class="walkbox"><h3>${SP(pc(x.n))} <span class="fing">finger ${x.f}</span>${both&&x.chord?` <span class="lhc">left hand: ${nameOf(x.chord)}</span>`:''}</h3>
      ${x.beats>=2?`<p class="hands">Hold it ${x.beats} ${U}s.</p>`:''}${tip?`<p class="hands move">${tip}</p>`:''}</div>
     <div class="kb">${keyboard(marksAt(cur),[rngLo,rngHi])}</div>${LEGEND}
     <div class="heard${flash?(flash.ok?' good':' bad'):''}">${heard}</div>
     <div class="walknav"><button class="btn small" data-a="back" ${cur===0?'disabled':''}>◀ Back a note</button><button class="btn small" data-a="hear">${playing?'■ Stop':'▶ Hear it from here'}</button><button class="btn small" data-a="restart">Start over ↺</button></div>
     <p class="note" style="margin-top:8px">Hear-it speed: <button class="btn small" data-a="s-">− 10</button> <b>${bpm()}</b> bpm <button class="btn small" data-a="s+">+ 10</button>${MID.ok?` · Right first time: <b>${clean} of ${cur}</b>`:''}</p>`;
    const on=(a,f)=>{const b=el.querySelector(`[data-a="${a}"]`);if(b)b.onclick=f};
    on('back',()=>{stopPlay();flash=null;miss=false;cur=Math.max(0,cur-1);draw()});
    on('restart',()=>{stopPlay();flash=null;miss=false;cur=0;clean=0;slips=[];draw()});
    on('hear',hear);
    on('s-',()=>{store.set(bk,Math.max(40,bpm()-10));draw()});on('s+',()=>{store.set(bk,Math.min(160,bpm()+10));draw()})};
  setTimeout(draw);return `<div class="diagram walker card" id="${id}"></div>`}

/* ---------- free recorder: play a song your own way; every note (both hands) is sent to Claude ---------- */
function songRecorder(label){const id='sr'+Math.random().toString(36).slice(2,7);let rec=false,ev=[],t0=0,hook=null;
  const NM=m=>NAMES[m%12]+(Math.floor(m/12)-1);
  const draw=()=>{const el=document.getElementById(id);if(!el)return;const n=ev.filter(e=>e[2]).length;

function bTiming(){const id='bt'+Math.random().toString(36).slice(2,7);const BPM=80,N=16;let clicks=[],hits=[],hook=null;

    el.querySelectorAll('[data-ans]').forEach(b=>b.onclick=e=>{e.stopPropagation();
      if(!cur){fb.innerHTML='<p class="note">Tap <b>Start</b> first. A chord plays, then you choose.</p>';return}
      if(answered)return;answered=true;b.setAttribute('aria-pressed','true');const right=(b.dataset.ans==='min')===cur.min;if(right)ok++;n++;
      fb.innerHTML=`<div class="heard ${right?'good':'bad'}"><div class="what"><span class="v">${right?'✓ Right!':'✗ Not this time.'}</span> That was <b>${cur.min?'MINOR (dark)':'MAJOR (bright)'}</b>.</div></div>`;
      if(n>=N){setTimeout(finish,1800);q('[data-a=go]').textContent='…'}else{q('[data-a=go]').textContent='Next chord ▶';st.innerHTML=`Chord ${n} of ${N} done. Score: <b>${ok}</b>`}})},0);
  return `<div class="card walker" id="${id}"><p class="note">The chords play on your Tyros (through your headphones) when the keyboard is connected, and on the iPad speaker too.</p><p data-st>Tap <b>Start</b>. A chord plays; then tap Major or Minor.</p><div class="chips" style="margin:10px 0"><button class="chip" data-ans="maj" aria-pressed="false">Major · bright</button><button class="chip" data-ans="min" aria-pressed="false">Minor · dark</button></div><div data-fb></div><p style="margin-top:10px"><button class="btn primary" data-a="go">Start</button> <button class="btn" data-a="cmp">Compare: G major, then G minor</button></p></div>`}
function bQuiz(){const id='bq'+Math.random().toString(36).slice(2,7);
  const Q=[['songs','Which songs can you play start to finish right now?','text'],
   ['keys','Which keys or home chords feel comfortable?','multi',['C','G','D','F','Am','Dm','Em','Other']],
   ['hearchange','When you listen to a song, can you hear when the chord changes?','one',['Usually','Sometimes','Rarely']],
   ['majmin','Can you tell a major chord from a minor one by ear?','one',['Yes','Sometimes','No']],
   ['leadsheet','Reading chord symbols on a lead sheet while playing:','one',['Easy','Slow','Can\'t yet']],
   ['fingers','Which right-hand fingers do you tend to avoid?','multi',['Pinky','Ring','Thumb','None']],
   ['other','Anything else I should know about how you play?','text']];
  setTimeout(()=>{const el=document.getElementById(id);if(!el)return;el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const q=b.dataset.q,multi=b.dataset.m==='1';if(!multi)el.querySelectorAll(`[data-q="${q}"]`).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'&&multi?'false':'true')});
    el.querySelector('[data-a=send]').onclick=()=>{const out=Q.map(q=>{let v;if(q[2]==='text')v=el.querySelector(`#${id}-${q[0]}`).value.trim();else v=[...el.querySelectorAll(`[data-q="${q[0]}"][aria-pressed="true"]`)].map(x=>x.textContent).join(', ');return `${q[1]} ${v||'(no answer)'}`});
      sendText('BASELINE 4 · Questions · '+out.join(' | '));el.querySelector('[data-a=send]').textContent='✓ Sent'}});
  return `<div class="card walker" id="${id}">${Q.map(q=>`<div style="margin-bottom:14px"><p style="margin:0 0 6px"><b>${q[1]}</b></p>${q[2]==='text'?`<textarea id="${id}-${q[0]}" class="copybox" rows="2"></textarea>`:`<div class="chips" style="flex-wrap:wrap">${q[3].map(o=>`<button class="chip" data-opt data-q="${q[0]}" data-m="${q[2]==='multi'?1:0}" aria-pressed="false">${o}</button>`).join('')}</div>`}</div>`).join('')}<button class="btn primary" data-a="send">Send answers to Claude</button></div>`}

/* ---------- lessons ---------- */
const RH5=(notes,fs)=>notes.map((n,i)=>({n,f:fs[i],h:'r'}));
const LESSONS=[
{id:'l1',title:'Lesson 1 · Four chords in C',status:'review',goal:'Play C, G, Am and F with your right hand and put the root under them with your left.',steps:[
 {t:'Warm up',min:3,b:`<p>Tap <b>Auto-play</b> and just listen to the four chords you'll learn today. Watch the picture change with each one.</p>`,d:()=>walker(['C','G','Am','F'],'C → G → Am → F')},
 {t:'Find the four chords',min:5,b:`<p>Right hand only. Thumb on the lowest note, middle finger in the middle, pinky on top. Press all three together, lift, release your hand, repeat.</p>`,d:()=>['C','G','Am','F'].map(k=>diagramChord(k,{hands:'r'})).join('')+LEGEND},
 {t:'Left hand: just the root',min:5,b:`<p>The <b>root</b> is the note the chord is named after. C chord → play a C. Am → play an A.</p><p>Left hand alone, pinky on each root, slow: <b>C → G → A → F</b>.</p>`,d:()=>diagramScale([{n:'C3',f:5,h:'l'},{n:'G2',f:5,h:'l'},{n:'A2',f:5,h:'l'},{n:'F2',f:5,h:'l'}],'Roots: C · G · A · F',['C3','G2','A2','F2'])},
 {t:'Hands together',min:8,b:`<p>Play the root and the chord at the same moment. Count 4 slow beats on each chord.</p><div class="say">C (1-2-3-4) → G → Am → F → back to C</div><p>Use the metronome at 60. If you stumble, slow down rather than stopping.</p>`,d:()=>diagramProg(['C','G','Am','F'])+['C','G','Am','F'].map(k=>diagramChord(k)).join('')},
 {t:'Play along with the guitar',min:5,b:`<p>Tap <b>Auto-play</b> and change chords along with the guitar. Both hands, matching the picture. Every chord starts on its own name note, the same shapes as step 2.</p>`,d:()=>walker(['C','G','Am','F'],'C → G → Am → F')}
]},
{id:'l2',title:'Lesson 2 · Smooth accompaniment',status:'review',goal:'Play C → G → Am → F without your right hand jumping around.',steps:[
 {t:'Warm up',min:3,b:`<p>Right hand, thumb on middle C. Slowly, <b>3–4 times only</b>:</p><div class="say">C D E F G F E D C &nbsp;·&nbsp; 1 2 3 4 5 4 3 2 1</div><p>Hand rounded like you're holding a small ball. Let the pinky sit where it naturally sits. Light presses. Then shake the hand out.</p>`,d:()=>diagramScale(RH5(['C4','D4','E4','F4','G4'],[1,2,3,4,5]),'C five-finger position',['C4','D4','E4','F4','G4','F4','E4','D4','C4'])},
 {t:'Same chords, closer together',min:6,b:`<p><b>Why this is allowed:</b> a chord is just its three notes. The order doesn't change which chord it is. G is G, B and D, whether you play G B D or B D G. Your left hand plays G underneath, so your ear still hears G.</p><p><b>Try it:</b> left hand on G. Right hand plays G B D, then B D G. Both sound like G.</p><p><b>Why bother:</b> it lets your hand stay put. From C (C E G), the nearest G, B and D are right there: G stays where it is, C slides down to B, E slides down to D. Tiny moves instead of a jump. The same trick keeps C on the bottom for C, Am and F.</p><p>This is how keyboard players sound smooth and change chords fast.</p>`,d:()=>['Cs','Gs','Ams','Fs'].map(k=>diagramChord(k,{hands:'r'})).join('')+LEGEND},
 {t:'Hands together',min:8,b:`<p>Left hand roots (C, G, A, F) with the pinky, right hand in the smooth shapes. 4 beats per chord, metronome 60–70.</p>`,d:()=>diagramProg(['Cs','Gs','Ams','Fs'])+['Cs','Gs','Ams','Fs'].map(k=>diagramChord(k)).join('')},
 {t:'Eyes off the page',min:3,b:`<p>Play the four chords 4 times <b>without looking at the screen</b>. Say the chord names out loud as you change.</p><div class="say">C → G → Am → F</div>`},
 {t:'Play along with the guitar',min:5,b:`<p>Tap <b>Auto-play</b> and play the smooth shapes along with the guitar. Notice how little your right hand moves.</p>`,d:()=>SONG.hash2()}
]},
{id:'l3',title:'Lesson 3 · The Jewish minor sound',status:'review',goal:'Play Am → Dm → E → Am, the three chords under a huge number of minor niggunim.',steps:[
 {t:'Warm up: the four chords you know',min:3,b:`<p>Warm up with Lesson 2's smooth shapes: <b>C → G → Am → F</b>, 4 slow beats each. Tap Auto-play and change chords with the guitar.</p>`,d:()=>walker(['Cs','Gs','Ams','Fs'],'Warm-up')},
 {t:'Pinky bursts, both hands',min:3,b:`<p>Short bursts only: <b>30–60 seconds</b>, rest, repeat 3 times. Stop at tiredness, don't push through soreness.</p><p>Right hand: thumb on A. Left hand: pinky on A (an octave lower).</p>`,d:()=>diagramScale([...RH5(['A3','B3','C4','D4','E4'],[1,2,3,4,5]),{n:'A2',f:5,h:'l'},{n:'B2',f:4,h:'l'},{n:'C3',f:3,h:'l'},{n:'D3',f:2,h:'l'},{n:'E3',f:1,h:'l'}],'A five-finger position, both hands',['A3','B3','C4','D4','E4','D4','C4','B3','A3'])+LEGEND},
 {t:'Meet Am, Dm and E',min:6,b:`<p>The secret ingredient is the <b>E chord</b>: it's E <b>major</b> (with G♯), not E minor. That G♯ is what makes it sound Jewish rather than generic sad-minor.</p><p>Watch how little your right hand moves between these shapes.</p>`,d:()=>['Amm','Dmm','Em'].map(k=>diagramChord(k,{hands:'r'})).join('')+LEGEND},
 {t:'Hands together',min:7,b:`<p>Left hand pinky on the roots <b>A → D → E → A</b>. Right hand in the shapes above. 4 slow beats each, metronome 60.</p><div class="say">Am → Dm → E → Am</div><p>Listen to how the E chord "pulls" back home to Am. That pull is the sound you'll hear all over shul.</p>`,d:()=>diagramProg(['Amm','Dmm','Em','Amm'])+['Amm','Dmm','Em'].map(k=>diagramChord(k)).join('')},
 {t:'Ear test',min:4,b:`<p>No singing needed. Let the app hold the chord while your right hand tests notes.</p><ul><li>Tap <b>Auto-play</b>. The guitar plays Am, then Dm, then E.</li><li>While each chord plays, put your right hand in the A five-finger position (thumb on A) and play A, B, C, D, E one at a time.</li><li>Listen: some notes sound <b>settled</b>, others <b>rub</b>. The settled ones are the notes inside that chord.</li></ul><p>On Am, A, C and E should feel settled. On Dm, listen for D and F. On E, listen for E and B. You're training your ear to hear which notes belong to which chord, which is how you'll find chords under a melody.</p>`,d:()=>walker(['Amm','Dmm','Em'],'Ear test chords')+diagramScale(RH5(['A3','B3','C4','D4','E4'],[1,2,3,4,5]),'Right hand: A five-finger position')},
 {t:'Play for fun: jam on the minor sound',min:4,b:`<p>Tap <b>Auto-play</b>. The guitar loops <b>Am → Dm → E → Am</b>.</p><p>Your right hand stays in the A five-finger position and makes up a tune over it, any notes you like. Lean on the notes that sounded settled in the ear test. This is how keyboard players improvise over a niggun.</p><p>Then tell me how the lesson went and I'll shape the next one.</p>`,d:()=>walker(['Amm','Dmm','Em','Amm'],'Jam loop')}
]},
{id:'l4',title:'Lesson 4 · Know it without looking',status:'review',goal:'Play Am, Dm and E from memory, so you don\'t need the picture.',steps:[
 {t:'Warm up with the picture',min:3,b:`<p>Tap <b>Auto-play</b> and play the minor loop with the picture, like last time. Both hands.</p>`,d:()=>walker(['Amm','Dmm','Em','Amm'],'Minor loop')},
 {t:'Three memory tricks',min:5,b:`<p>You don't have to memorize three separate shapes. Remember these instead:</p>
  <div class="say">Left hand: the chord's name IS the note. Am → A. Dm → D. E → E.</div>
  <ul><li><b>Am:</b> thumb on A, then skip one, take one: <b>A C E</b>. All white keys.</li>
  <li><b>Dm:</b> thumb <b>stays</b> on A. Your other two fingers each step up one key: <b>A D F</b>.</li>
  <li><b>E:</b> the only one with a black key. Thumb slides down onto the black key <b>G♯</b>, then <b>B</b> and <b>E</b>.</li></ul>
  <p>Tap through the chords below and say each trick out loud as you play it.</p>`,d:()=>walker(['Amm','Dmm','Em'],'Check each trick')},
 {t:'Picture off: in order',min:5,b:`<p>Now the picture is hidden. You'll only see the chord name. Play it from memory, then tap <b>Next chord</b>.</p><p>Stuck? Tap <b>Peek</b>. Peeking is fine: each peek is a rep that helps it stick.</p>`,d:()=>walker(['Amm','Dmm','Em','Amm'],'From memory',0,{hide:true})},
 {t:'Picture off: mixed up',min:5,b:`<p>Same thing, but the chords come in a random-feeling order, so you can't just follow the pattern. Name, then play.</p>`,d:()=>walker(['Dmm','Em','Amm','Em','Dmm','Amm','Dmm','Em'],'Mixed order',0,{hide:true})},
 {t:'Jam without the picture',min:5,b:`<p>Tap <b>Auto-play</b>. The guitar loops Am → Dm → E → Am and you only see the names. Left hand plays the chord, right hand adds a little melody, like your jam in Lesson 3.</p><p>Then tell me how many peeks you needed. That tells me whether to move on or repeat this.</p>`,d:()=>walker(['Amm','Dmm','Em','Amm'],'Jam from memory',0,{hide:true})}
]},
{id:'t1',title:'Tyros 1 · Make the band follow you',status:'review',goal:'Turn on the Tyros 5 band and drive it with the left-hand chords you already know.',steps:[
 {t:'Get set up',min:3,b:`<p>The Tyros needs the step-down transformer (230V to 120V) before it can be switched on. Never plug it straight into an Israeli outlet.</p><ul><li>Transformer into the wall, Tyros into the transformer, then power on.</li><li>Master volume low to start.</li></ul>`},
 {t:'Pick a style',min:3,b:`<p>A <b>style</b> is the band: drums, bass, guitars, all playing together.</p><ul><li>Press one of the <b>STYLE</b> category buttons. A list opens on the screen.</li><li>Press one of the buttons <b>[A]–[J]</b> beside the screen to choose a style. Use the one in the box: a freilach.</li></ul><p>Once the style is playing, the app reads the band's speed and tells you if it fits.</p>`,style:'freilach'},
 {t:'Let your left hand lead the band',min:5,b:`<p><b>First, move the split point up.</b> By default the band only reads chords in the lowest keys, far left. We'll move the dividing line up to the <b>B just below middle C</b>, so your left hand plays chords in the same spot as in your piano lessons. On the Tyros 5 this is in the <b>FUNCTION</b> menu, on the <b>Split Point / Fingering</b> page: set the style split point to that B.</p><ul><li>Press <b>[ACMP]</b> so the light is on. Now the left part of the keyboard tells the band which chord to play.</li><li>Press <b>[SYNC START]</b>. The band is waiting.</li><li>Play <b>Am</b> with your left hand. The band starts, in Am.</li><li>Press <b>[START/STOP]</b> to stop.</li></ul><p>Below are the left-hand chord shapes, just below middle C. All three use fingers <b>5-3-1</b>: pinky on the bottom, middle finger, thumb on top. The map shows the shaded band zone.</p>`,d:()=>walker(['AmL','DmL','EL'],'Left-hand chords')},
 {t:'Change chords, the band follows',min:6,style:'freilach',b:`<p>Start the band with Am again, then change your left hand: <b>Am → Dm → E → Am</b>, 4 beats each. The whole band changes chord with you.</p><p>This is why the chord lessons matter: your left hand is now steering a full band.</p>`,d:()=>walker(['AmL','DmL','EL'],'Left hand drives the band')},
 {t:'Give your right hand a sound',min:4,b:`<ul><li>Press one of the <b>ONE TOUCH SETTING</b> buttons (1–4). The Tyros picks a right-hand sound that suits the style.</li><li>Or choose your own: press <b>PART SELECT [RIGHT 1]</b>, make sure <b>PART ON/OFF [RIGHT 1]</b> is on, press a <b>VOICE</b> button such as <b>[PIANO]</b>, then pick with <b>[A]–[J]</b>.</li></ul>`},
 {t:'Play for fun: one-man band',min:5,style:'freilach',b:`<p>Band on, left hand looping Am → Dm → E → Am, right hand playing a little melody on top, like your jam in Lesson 3. That's the one-man band.</p>`}
]},
{id:'t2',title:'Tyros 2 · Lock in the left hand',status:'review',gate:{label:'Mixed order, from memory',need:3},goal:'Make the new left-hand shapes automatic: thumb anchored on A, smooth moves, no picture. The next lesson unlocks after 3 clean runs in a row from memory.',steps:[
 {t:'Setup check',min:2,b:`<ul><li>Split point at <b>B2</b> (the B just below middle C). Chord fingering on <b>Fingered</b>.</li><li><b>PART ON/OFF [LEFT]</b> on, so the app can hear your left hand. Turn its volume down if you don't want to hear it.</li><li>Band off for now. Just you and the app.</li></ul>`},
 {t:'Thumb anchor',min:3,b:`<p>Your thumb's home is the <b>A just below middle C</b>. Every left-hand chord in this lesson starts from there.</p><ul><li>Play Am (C E A), let go completely, drop your hand in your lap.</li><li>Bring it back and land the <b>thumb on A first</b>, then the other two fingers.</li><li>Do it 4 times. The app moves on each time you land it.</li></ul><p>Your last session showed the thumb landing on G instead of A. This step fixes exactly that.</p>`,d:()=>walker(['AmL','AmL','AmL','AmL'],'Thumb anchor')},
 {t:'Am ↔ Dm: thumb stays',min:4,b:`<p>Going <b>Am → Dm</b>, your <b>thumb stays on A</b>. Pinky steps up C → D, middle finger steps up E → F. Coming back, both step down.</p><p>Slowly, back and forth. The app shows exactly which fingers move each time.</p>`,d:()=>walker(['AmL','DmL','AmL','DmL','AmL','DmL'],'Am and Dm')},
 {t:'E → Am: the return trip',min:5,b:`<p>This was your trickiest move last time. Going <b>E → Am</b>:</p><div class="say">Middle finger stays on E. Pinky up B → C. Thumb up G♯ → A.</div><p>Both outside fingers move up one key at the same time; the middle one doesn't move. Going Am → E is the same in reverse: both outside fingers step down.</p>`,d:()=>walker(['EL','AmL','EL','AmL','EL','AmL'],'E and Am')},
 {t:'Full loop, with the picture',min:4,b:`<p>Am → Dm → E → Am. Watch the moves; by now most fingers should be finding their way without looking.</p>`,d:()=>walker(['AmL','DmL','EL'],'Full loop')},
 {t:'Picture off: in order',min:4,b:`<p>Only the chord name now. Thumb on A first, then play it. Peeking is fine; it still counts as practice.</p>`,d:()=>walker(['AmL','DmL','EL'],'In order, from memory',0,{hide:true})},
 {t:'Ready check: mixed order',min:6,b:`<p>The chords come in a mixed order, picture off. <b>Get 3 clean runs in a row</b> to pass this lesson. A run with any slip resets the count, so slow down, find the thumb first, and be accurate before fast.</p><p>You can still finish the lesson and send your results either way. Claude only unlocks the next lesson once you've passed. If it takes a few sessions, that's normal.</p>`,d:()=>walker(['DmL','EL','AmL','EL','DmL','AmL','EL','AmL'],'Mixed order, from memory',0,{hide:true,gate:3})},
 {t:'Now with the band',min:5,style:'freilach',b:`<p>Band on: <b>[ACMP]</b>, <b>[SYNC START]</b>, a freilach. Play the loop <b>Am → Dm → E → Am</b>, 4 beats each, picture off. The band follows your left hand.</p><p>Add a little right-hand melody once the left hand feels automatic.</p>`,d:()=>walker(['AmL','DmL','EL'],'With the band',0,{hide:true})}
]},
{id:'b1',title:'Baseline · Where you are now',status:'review',goal:'A once-off check of how you play today, so Claude can rebuild the lesson plan around you. No right or wrong answers.',steps:[
 {t:'Setup',min:2,b:`<ul><li>Keyboard connected in the app (green button).</li><li><b>[ACMP] off</b> and no style playing, so the app hears only you.</li><li><b>PART ON/OFF [LEFT]</b> on, so your left hand is heard.</li><li>Pick a plain piano sound.</li></ul><p>Play the way you naturally do in every step. Don't try to "do it right"; the point is to see your real habits.</p>`},
 {t:'Play it your way',min:4,b:`<p>Play any song you know, your usual way: your fingering, your chord shapes, wherever your hands normally go. The app records what each hand does.</p>`,d:()=>bFree()},
 {t:'Chord recall',min:4,b:`<p>A chord name appears. Play it any way you know it, with either hand. If you don't know one, tap <b>I don't know this one</b>. That's useful information, not a failure.</p>`,d:()=>bRecall()},
 {t:'Timing',min:2,b:`<p>One chord on every click. The app measures how steady you are, which matters a lot when playing with a band or a room full of people.</p>`,d:()=>bTiming()},
 {t:'Six questions',min:3,b:`<p>The things the app can't hear. Quick taps are fine.</p>`,d:()=>bQuiz()},
 {t:'Hands video',min:2,b:`<p>The one thing MIDI can't see is <b>which fingers</b> you use.</p><ul><li>Prop your phone above the keyboard so both hands are in view.</li><li>Record about 30 seconds of a song, played your usual way.</li><li>Send the video to Claude in the chat.</li></ul><p>Then tap <b>Finish lesson</b>. Claude will put together your skills map and the new plan.</p>`}
]},
{id:'t3',title:'Tyros 3 · Same moves, your key: G minor',status:'today',gate:{label:'Gm mixed order, from memory',need:3},goal:'Your book songs and most of your freilach sets sit in G minor. Move the left-hand loop you just passed down to Gm → Cm → D. After this lesson, practice the Nishmas song Yiboneh Hamikdash. The next lesson unlocks after 3 clean mixed runs in a row.',steps:[
 {t:'Warm-up: the A minor loop',min:3,b:`<p>One loop of what you passed last time, picture off. Watch one thing: on <b>Am</b> your middle finger likes to land on <b>F</b>. It belongs on <b>E</b>, the white key right next to it, one lower.</p>`,d:()=>walker(['AmL','DmL','EL'],'Warm-up Am loop',0,{hide:true})},
 {t:'Why G minor',min:2,b:`<p>In your Baseline you played a song from your book in <b>G minor</b>: Gm, Cm, B♭ and D. Your freilach list is mostly G minor, C minor and F minor too. So that's where your hands need to live.</p><div class="say">Am → Dm → E is the same trip as Gm → Cm → D. Same hand shapes, same moves, just two white keys lower.</div><p>Tap play and listen: it's the same little story, a bit lower.</p>`,d:()=>walker(['GmL','CmL','DL'],'Hear Gm Cm D')},
 {t:'What makes a chord',min:5,b:`<p>Every chord is built the same way:</p><div class="say">Play a key, skip a white key, play, skip, play.</div><p><b>G</b>, skip A, <b>B</b>, skip C, <b>D</b> = G B D. The bottom note gives the chord its name.</p><p>The <b>middle note</b> decides how it sounds:</p><ul><li><b>G B D</b> sounds bright. That's G major, written just "G".</li><li>Move the middle note down one key, onto the black key: <b>G B♭ D</b>. Now it sounds dark. That's G minor, "Gm".</li><li>The other way round on D: <b>D F A</b> is dark (Dm). Move the middle note <i>up</i> onto the black key: <b>D F♯ A</b> is bright, D major.</li><li><b>Cm</b> is C, E♭, G: skip-a-key, with the middle note moved down to the black key. Dark.</li></ul><p>And the order doesn't matter. <b>B♭ D G</b> is still those same three notes, so it's still Gm. That's all your new left-hand shape is: the same Gm, with the G played on the right side instead of the left.</p><p>Play each one below and listen: bright, dark, dark, bright.</p>`,d:()=>walker(['GO','GmO','DmL','DO'],'What makes a chord')},
 {t:'Thumb anchor on G',min:3,b:`<p>New home for the thumb: the <b>G just below middle C</b>. Gm is <b>B♭ D G</b>: pinky on the black key B♭, middle finger on D, thumb on G.</p><ul><li>Play it, let go, hand in your lap.</li><li>Come back and land the <b>thumb on G first</b>.</li><li>4 times.</li></ul>`,d:()=>walker(['GmL','GmL','GmL','GmL'],'Thumb anchor G')},
 {t:'Gm ↔ Cm: thumb stays',min:4,b:`<p>Just like Am → Dm: the <b>thumb stays on G</b>. Pinky steps up B♭ → C, middle finger steps up D → E♭ (the black key).</p>`,d:()=>walker(['GmL','CmL','GmL','CmL','GmL','CmL'],'Gm and Cm')},
 {t:'D → Gm: the return trip',min:5,b:`<p>Just like E → Am:</p><div class="say">Middle finger stays on D. Pinky up A → B♭. Thumb up F♯ → G.</div><p>The D chord has F♯, the black key under your thumb. That's the pull that makes it want to go home to Gm, like G♯ did for Am.</p>`,d:()=>walker(['DL','GmL','DL','GmL','DL','GmL'],'D and Gm')},
 {t:'Full loop, with the picture',min:4,b:`<p>Gm → Cm → D → Gm, 4 beats each.</p>`,d:()=>walker(['GmL','CmL','DL'],'Gm full loop')},
 {t:'Old shape → new shape',min:5,b:`<p>Your hands remember the old shapes, so we start there and move one finger.</p><ul><li><b>Gm:</b> play your old Gm (G on the bottom). The app says "that's your old Gm." Keep <b>B♭ and D</b> pressed. Let go of the <b>G on the left</b>, and press the <b>G on the right side</b> instead (3 white keys past the D). Now you're holding B♭ D G.</li><li><b>D:</b> play your old D (D F♯ A). Keep <b>D and F♯</b> pressed. Let go of the <b>A on the right</b>, and press the <b>A on the left side</b> instead (just below the D). Now you're holding A D F♯.</li><li><b>Cm</b> doesn't change at all: C E♭ G is the shape you've always played.</li></ul><p>Say it out loud while you do it: <i>"old, then move."</i> The app only moves on once you land the new shape.</p>`,d:()=>walker(['GmL','GmL','GmL','DL','DL','DL'],'Old to new',0,{bridge:{GmL:'keep B♭ and D pressed. Let go of the G on the left, and press the G on the right side instead, 3 white keys past the D.',DL:'keep D and F♯ pressed. Let go of the A on the right, and press the A on the left side instead, just below the D.'}})},
 {t:'Ready check: mixed order',min:6,b:`<p>Picture off, mixed order. <b>3 clean runs in a row</b> to pass. Thumb on G first, then the chord. Accurate before fast.</p><p>You can finish and send your results either way. Claude unlocks the next lesson once you've passed.</p>`,d:()=>walker(['CmL','DL','GmL','DL','CmL','GmL','DL','GmL'],'Gm mixed order, from memory',0,{hide:true,gate:3})},
 {t:'Extra: with the band',min:5,style:'freilach',b:`<p><b>Optional.</b> <b>[ACMP]</b> on, <b>[SYNC START]</b>, a freilach. Gm → Cm → D → Gm, picture off. Connect the app <b>before</b> you start the style, so it can read the band's beat.</p>`,d:()=>walker(['GmL','CmL','DL'],'Gm with the band',0,{hide:true})},
 {t:'Ear: major or minor',min:4,b:`<p>Your Baseline said you can't hear major vs minor yet. That's the next ear skill, and it's quick to build.</p><ul><li><b>Major</b> sounds bright and open.</li><li><b>Minor</b> sounds darker, more serious: the sound of most of your freilachs.</li></ul><p>Tap <b>Compare</b> first to hear the same chord both ways. Then do 10.</p>`,d:()=>earQuiz()}
]},
{id:'s3',title:"Carlebach · L'maan Achai",status:'song',goal:"Reb Shlomo's L'maan Achai V'Rei'ai, straight from your 2015 book (page 51). It's in G minor, so the left hand uses the Gm, Cm and D shapes from Tyros 3. The right hand plays the tune you already know, now with the right fingers.",steps:[
 {t:'Play it your way',min:5,b:`<p>Before any lesson steps: play L'maan Achai <b>the way you normally play it</b>, both hands, once through. The sheet is here if you want it.</p><p>Tap <b>Start recording</b>, play, then tap <b>Stop</b>. Every note goes to Claude, so the lesson can be rebuilt around how you actually play it.</p>`,d:()=>`<img class="sheet" src="sheets/lmaan-page.png" alt="L'maan Achai, your page">`+songRecorder("L'maan Achai, your way")},
 {t:'The song and the sheet',min:3,b:`<div class="say">Piano setup: <b>[ACMP] off</b>. <b>PART ON/OFF [LEFT]</b> on, <b>PART SELECT [LEFT]</b> → <b>[PIANO]</b>. Right hand on piano too.</div><p>Your sheet says <b>"Slow 6"</b>: it's in <b>6/8</b>. Each bar has six quick counts in two groups: <b>1</b>-2-3 <b>4</b>-5-6. Feel it as two slow swaying beats per bar, the way a kumzitz sways.</p><p><b>How it's built:</b></p><ul><li>The <b>A part</b> is played twice. The first time ends at box <b>1</b> and goes back. The second time takes box <b>2</b>.</li><li>The <b>B part</b> (the higher part) is also played twice, the same way.</li><li>The song <b>starts on a pickup</b>: one short D just before the first bar line, on the "6" before beat 1.</li></ul><p>In this lesson the app counts in <b>eighth notes</b>, so "hold 5" means five quick counts.</p>`,d:()=>`<img class="sheet" src="sheets/lmaan-page.png" alt="L'maan Achai, your page">`+listen('Carlebach Lmaan Achai')},
 {t:'How your right hand should play',min:4,b:`<p>In piano style, <b>the right hand plays the melody</b>. These habits keep it smooth:</p><ul><li><b>Curved fingers</b>, as if holding a small ball. Play on the <b>fingertips</b>, with the wrist level with the keys.</li><li><b>Use all five fingers, pinky included.</b> In the A part the pinky plays the high B♭ in almost every phrase.</li><li><b>One finger per key.</b> Where your thumb sits is the hand's <b>position</b>. Move only when the tune runs out of fingers, and move during a long note.</li><li><b>Smooth:</b> keep each note down until the next one goes down. For a repeated note (B♭ B♭ B♭), lift just enough to play it again.</li><li><b>Melody on top:</b> right hand a little firmer, left hand softer.</li></ul><p>Warm-up: the opening shape of the song. Pointer finger on D, thumb on C♯ just below it, then the hand opens up to B♭-A-G with fingers 5-4-3. Play it until it feels like one movement.</p>`,d:()=>melody('D4:1:2 C#4:1:1 D4:1:2 A#4:1:5 A4:1:4 G4:1:3 | D4:1:2 C#4:1:1 D4:1:2 A#4:1:5 A4:1:4 G4:3:3','Warm-up: the opening shape',{bpm:90,meter:6,unit:'eighth'})},
 {t:'Left hand: your shapes, plus two 7ths',min:5,b:`<p>The left hand already knows <b>Gm</b>, <b>Cm</b> and <b>D</b> from Tyros 3. This song adds two "7" chords. Each is one finger away from a shape you know:</p><ul><li><b>D7</b> (A C F♯): play <b>D</b> (A D F♯) and drop the <b>middle finger from D to C</b>. D7 pulls hard back to Gm: every finger then moves up one key.</li><li><b>G7</b> (B F G): play <b>Gm</b> (B♭ D G), move the <b>pinky up to B</b> and the <b>middle finger up to F</b>. From G7 to Cm the thumb stays on G, and the other two fingers step to C and E♭.</li></ul><p>Then the A part's chords in order. The app holds each chord for its real length.</p><p class="note">Bar 3 of your sheet shows a quick "Ami" in the second half. For now, keep holding Cm there. It's nearly the same notes.</p>`,d:()=>walker(['GmL','CmL','DL','D7L','GmL','G7L','CmL','D7L','GmL'],'New shapes')+lmChords(['a1'],"L'maan Achai: A chords")},
 {t:'A part · right hand',min:7,b:`<p>Right hand alone. Start with the pickup D (finger 2). Then: <b>D-C♯-D</b> (2-1-2), and open the hand to <b>B♭-A-G</b> (5-4-3).</p><ul><li>The long E♭ takes the <b>thumb</b>. On the next E♭, switch to finger 3 so the hand can walk down E♭-D-C.</li><li>The bar with <b>F-E♭-D-C</b> walks down to middle C with fingers 4-3-2-1.</li><li>Then <b>F♯</b> (finger 2, black key) to <b>A</b> (finger 4), and home to G.</li></ul><p>The first box goes back to the start. The second box ends on G, ready for the B part.</p>`,d:()=>lmMel(['a1','a2'],'A part (both times)')},
 {t:'B part · right hand',min:6,b:`<p>The B part sits higher. Put your <b>thumb on G</b> (above middle C), and B♭ is <b>finger 3</b>. Most of the B part is repeated B♭s on finger 3, so keep that finger springy.</p><ul><li>Bar 3 climbs <b>C-C-D</b>: fingers 4-4-5, then a quick C-B♭-C turn.</li><li>The last bar of box 1 has a quick <b>G-A</b> that leads back into the B part.</li></ul>`,d:()=>lmMel(['b1','b2'],'B part (both times)')},
 {t:'Left hand: chords for the B part',min:5,b:`<p>Three more shapes, each a small move from one you know:</p><ul><li><b>F7</b> (A E♭ F): it leads to <b>B♭</b> (B♭ D F). The thumb stays on F, the pinky steps up to B♭ and the middle finger steps down to D.</li><li><b>E♭</b> (B♭ E♭ G): keep the Gm pinky and thumb, and move the middle finger from D up to E♭.</li><li><b>Cm6</b> (A C E♭) goes to <b>D7</b> (A C F♯): only the thumb moves, from E♭ to F♯.</li></ul>`,d:()=>walker(['F7L','BbL','D7L','GmL','EbL','Cm6L','D7L','GmL'],'B part shapes')+lmChords(['b1'],"L'maan Achai: B chords")},
 {t:'Hands together: A part',min:8,b:`<p>Left hand holds the chord, right hand plays the melody. The app follows the right hand, and the left hand's chord shows next to each note.</p><ul><li>Press the chord <b>together with the melody note on beat 1</b> (or beat 4 when the chord changes mid-bar). Hold it while the right hand moves.</li><li>Go slow. If the hands fall apart, lower the speed. Don't stop the left hand.</li></ul>`,d:()=>lmMel(['a1','a2'],'Together: A part twice',{both:true,bpm:80})},
 {t:'Hands together: B part',min:8,b:`<p>Same idea for the B part. The busiest spot is bar 3 (Cm → F7) into bar 4 (B♭ → D7): two chords per bar, one on each big beat.</p>`,d:()=>lmMel(['b1','b2'],'Together: B part twice',{both:true,bpm:80})},
 {t:'The whole song',min:8,b:`<p>A, A, B, B: the whole niggun. When it flows at 80, use <b>Hear it</b> at 100, then 120. A slow 6 feels right around 120–140 counts.</p><p class="note">Finished? Your results go to Claude automatically. Tell Claude which other Carlebach songs you know, and the next lessons will use those.</p>`,d:()=>lmMel(['a1','a2','b1','b2'],"L'maan Achai, whole song",{both:true,bpm:90})}
]}
];

/* ---------- the 'why' beside each step ---------- */
const WHYSTEP={
 l1:["Hearing it first gives your hands a target. You'll know what right sounds like before you try.",
  "Every chord is three keys with one key skipped between each. That's why the same hand shape works for all four: you just slide it to a new starting key. Try it: put your hand on C E G, then slide the whole shape up to F A C. Same shape, new chord.",
  "The lowest note is the one your ear uses to name the chord. Play C E G with A underneath and it starts to sound like a different chord. The bottom note is the foundation, so the left hand's job is to give it.",
  "These four chords share keys with each other, which is why they flow so naturally one after another. It's also why this order shows up in so many songs you already know.",
  "Playing with the guitar trains you to change on time. At a simcha, changing on time matters more than playing fancy."],
 l2:["Five fingers on five neighboring keys means your hand never has to jump. Using the pinky is what makes that possible.",
  "A chord is just its three notes, in any order. So instead of jumping to where the next chord starts, you grab the nearest copy of each note. Try it: play C E G, then reach for the closest G, B and D without moving your hand. That's G, and your hand barely moved.",
  "The right hand rearranged the notes, but the left hand still plays the name note at the bottom, so your ear still hears the right chord.",
  "At shul there's no screen. Saying the names while you play connects the name, the sound and the hand shape, so they come back together.",
  "This is where the smooth shapes pay off. Real songs change chords fast, and a hand that barely moves can keep up."],
 l3:["Starting with something you already know warms up your hands before the new part.",
  "The A position puts your fingers exactly where today's chords live. Short bursts build control; pushing through soreness just builds tension.",
  "That one black key in E is the whole Jewish sound. Try it: play E with a plain G instead of G♯. It sounds flat and doesn't go anywhere. Put the G♯ back and it suddenly wants to go home to Am. That pull is what you hear at the end of lines at shul.",
  "Am feels like home, Dm feels like stepping out, E feels like tension, and Am again is coming home. Once you feel that story, you can guess where a song is going before it gets there.",
  "Notes inside the chord sound settled. Notes outside it rub. That rubbing is your ear telling you the chord needs to change, and it's how you'll find chords by ear.",
  "Making up a tune is easy when you lean on the settled notes. They always sound right over that chord."],
 l4:["Warming up with the picture reminds your hands where everything is before the picture goes away.",
  "Tricks beat memorizing. Remembering one anchor and a couple of small moves is much easier than remembering three separate shapes.",
  "Pulling the answer from memory is what makes it stick. Every time you peek and then play it right, the memory gets stronger.",
  "In a real song the chords don't come in a neat order, so mixing them up proves you actually know each one.",
  "Playing from memory while the guitar keeps going is exactly what it feels like at shul."],
 t1:["The transformer protects the Tyros. It's built for American power, and Israeli outlets would damage it.",
  "A style is a whole band waiting for instructions. Your left hand is the conductor.",
  "With ACMP on, the band listens to the left part of the keyboard. Whatever chord you hold there, the band plays.",
  "This is why the chord lessons matter. Your left hand isn't playing chords anymore, it's steering a whole band.",
  "The right hand is the singer. Choosing its sound decides what the crowd hears on top.",
  "Left hand steering the band, right hand singing on top: that's the whole one-man-band idea."],
 t2:["Each of these settings makes the app and the band hear exactly what your hands do. Then your mistakes show up honestly.",
  "Every chord here is built around the thumb. When the thumb lands right, the other fingers just fall into place, so you're really only remembering one thing.",
  "Am and Dm share the A, so the thumb never moves. Only two fingers step up. Smaller moves mean faster, cleaner changes.",
  "Am and E share the E. That's why the middle finger stays put and only the outside fingers move. Try it: hold E, and feel how close C and A are to your pinky and thumb.",
  "Watching the moves now saves you from having to think about them later.",
  "Recalling without the picture is what turns a shape into a habit.",
  "Three clean in a row proves it isn't luck. That's when it's really yours.",
  "With the band going you can't stop to think. If the shapes hold up here, they'll hold up at a simcha."],
 t3:["Warming up on shapes you already own gets your hands set before the new key.",
  "Learning one pattern and moving it is much faster than learning a new one. Your hands already know these moves; they just need a new starting spot.",
  "Once you know that a chord is three skip-a-key notes, and that the middle note makes it bright or dark, you can build any chord yourself, in any order, anywhere on the keyboard. You never have to memorize spots again.",
  "Same trick as before: when the thumb lands right, the other two fingers fall into place.",
  "Gm and Cm share the G, so the thumb never moves. Small moves mean clean, fast changes.",
  "Gm and D share the D. The F♯ is a black key that sits just under G, so it leans into it. That lean is what makes a line sound finished.",
  "Watching the moves once more now saves thinking later.",
  "Your old shapes are a strong memory, so we use them instead of fighting them. Each new shape is the old one with a single note moved, and moving one finger is easy to remember.",
  "Three clean in a row proves it isn't luck.",
  "With a band going you can't stop to think. If the shapes hold here, they'll hold at a simcha.",
  "Most simcha songs switch between minor and major chords. Hearing which one is coming lets you follow a song you've never played."],
 s1:["Reading the whole song first gives your ear a map before your hands start.",
  "Learning a chord as one small move from a chord you know is much easier than learning a new shape from scratch.",
  "Short sections at the real timing build the habit of changing on the beat, not when you happen to be ready.",
  "The B part repeats the same idea three times, each line ending on E. Once you feel that, the whole part is easy to remember.",
  "Playing the melody by ear on top of your own chords is real piano style. It's how you'll play at Nishmas."]
};

/* ---------- lesson state ---------- */
/* lessons Claude has unlocked; a lesson's "Next" button only works when the next lesson is listed here */
const OPEN=['l1','l2','l3','l4','t1','t2','b1','t3','s3'];
let prog=store.get('bkc-prog',{});
let curLesson=store.get('bkc-cur','l3');
function lp(id){if(!prog[id])prog[id]={step:0,done:[]};return prog[id]}
function save(){store.set('bkc-prog',prog);store.set('bkc-cur',curLesson)}

/* ---------- timer & metronome ---------- */
const timer={left:0,running:false,iv:null};
const metro={on:false,bpm:store.get('bkc-bpm',60),next:0,beat:0,iv:null};
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(timer.running)return;ac();keepAwake();timer.running=true;const end=Date.now()+timer.left*1000;
  timer.iv=setInterval(()=>{timer.left=(end-Date.now())/1000;if(timer.left<=0){timer.left=0;stopTimer();chime()}paintTimer()},250);paintTimer()}
function stopTimer(){timer.running=false;clearInterval(timer.iv);paintTimer()}
function chime(){const a=ac();if(!a)return;const t=a.currentTime;[72,76,79].forEach((m,i)=>tone(m,t+i*.15,.6,.12));toast('Time\'s up. Finish your rep, then tap Next.')}
function paintTimer(){const el=document.getElementById('tt');if(!el)return;el.textContent=fmt(timer.left);el.classList.toggle('end',timer.left<=0);
  const b=document.getElementById('tbtn');if(b)b.textContent=timer.running?'Pause':(timer.left<=0?'Restart':'Start timer')}
function metroTick(){const a=ac();while(metro.next<a.currentTime+.12){const acc=metro.beat%4===0;click(metro.next,acc);
  const b=metro.beat%4,d=(metro.next-a.currentTime)*1000;setTimeout(()=>{document.querySelectorAll('.beat').forEach((e,i)=>e.classList.toggle('on',i===b))},Math.max(0,d));
  metro.next+=60/metro.bpm;metro.beat++}}
function toggleMetro(){const a=ac();if(!a)return;metro.on=!metro.on;if(metro.on){keepAwake();metro.beat=0;metro.next=a.currentTime+.08;metro.iv=setInterval(metroTick,25)}else{clearInterval(metro.iv);document.querySelectorAll('.beat').forEach(e=>e.classList.remove('on'))}
  const b=document.getElementById('mbtn');if(b)b.textContent=metro.on?'Stop':'Metronome'}

/* ---------- render lesson ---------- */
function renderLesson(){
  CUR_STYLE=null;const L=LESSONS.find(l=>l.id===curLesson)||LESSONS[2];const P=lp(L.id);const i=Math.min(P.step,L.steps.length-1);const S=L.steps[i];
  const tagTxt={review:'Review',today:'Today',next:'Up next',song:'Song'};
  const total=L.steps.reduce((a,s)=>a+s.min,0);
  const el=document.getElementById('tab-lesson');
  if(P.complete){const ni=LESSONS.indexOf(L)+1,N=LESSONS[ni],open=N&&OPEN.includes(N.id);
    el.innerHTML=`<div class="stack">
     <div class="chips" role="group" aria-label="Lessons">${LESSONS.map(l=>`<button class="chip" data-l="${l.id}" aria-pressed="${l.id===L.id}">${l.title.split(' · ')[0]}<span class="tag ${l.status}">${tagTxt[l.status]}</span></button>`).join('')}</div>
     <div class="lessonhead"><div class="eyebrow">${L.title.split(' · ')[0]} · complete</div><h2>${L.title.split(' · ')[1]}</h2><p>${L.goal}</p>
      <div class="progress">${L.steps.map(()=>`<span class="done"></span>`).join('')}</div></div>
     <article class="card"><div class="eyebrow">Lesson complete</div><h3>Nice work. Now get it reviewed.</h3>
      <div class="body"><p>Your results are saved. Tell Claude <b>"check my keyboard results"</b>. Claude looks at every slip and decides whether you're ready to move on or should run this lesson again.</p></div>
      <div class="controls"><button class="btn" id="restart">Restart lesson</button><button class="btn primary" id="moveon" ${open?'':'disabled'}>${open?'Next: '+N.title.split(' · ')[0]:'🔒 Next lesson locked'}</button></div>
      ${open?'':'<p class="note" style="margin-top:10px">Claude unlocks the next lesson after reviewing your results.</p>'}
     </article></div>`;
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curLesson=b.dataset.l;stopTimer();timer.left=0;save();renderLesson();scrollTo(0,0)});
    document.getElementById('restart').onclick=()=>{P.complete=false;P.step=0;P.done=[];save();renderLesson();scrollTo(0,0)};
    const mo=document.getElementById('moveon');if(open)mo.onclick=()=>{curLesson=N.id;save();renderLesson();scrollTo(0,0)};
    return}
  el.innerHTML=`<div class="stack">
   <div class="chips" role="group" aria-label="Lessons">${LESSONS.map(l=>`<button class="chip" data-l="${l.id}" aria-pressed="${l.id===L.id}">${l.title.split(' · ')[0]}<span class="tag ${l.status}">${tagTxt[l.status]}</span></button>`).join('')}</div>
   <div class="lessonhead"><div class="eyebrow">${L.title.split(' · ')[0]} · about ${total} min</div><h2>${L.title.split(' · ')[1]}</h2><p>${L.goal}</p>
    <div class="progress">${L.steps.map((s,j)=>`<span data-s="${j}" title="${s.t}" class="${j===i?'cur':P.done.includes(j)?'done':''}"></span>`).join('')}</div></div>
   <article class="card">
    <div class="stephead"><div><div class="eyebrow">Step ${i+1} of ${L.steps.length}</div><h3>${S.t}</h3></div><div class="min">${S.min} min</div></div>
    <div class="split"><div><div class="body">${S.b}</div>${S.style?styleBox(S.style):''}${(WHYSTEP[L.id]||[])[i]?`<aside class="whybox"><div class="eyebrow">Why this works</div><p>${WHYSTEP[L.id][i]}</p></aside>`:''}</div>${S.d?`<div class="diags">${S.d()}</div>`:''}</div>
    <div class="timer"><span class="t" id="tt"></span><button class="btn small" id="tbtn"></button>
     <span class="metro" style="margin-left:auto"><button class="btn small" id="mbtn">${metro.on?'Stop':'Metronome'}</button></span></div>
    <div class="metro" style="margin-top:8px"><span class="bpm" id="bpmv">${metro.bpm} bpm</span><input type="range" id="bpm" min="40" max="140" step="2" value="${metro.bpm}" aria-label="Tempo"><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div>
    <div class="controls"><button class="btn" id="prev" ${i===0?'disabled':''}>Back</button><button class="btn primary" id="next">${i===L.steps.length-1?'Finish lesson':'Done · Next step'}</button></div>
   </article>
   ${false?`<div class="card"><div class="eyebrow">Coming after this</div><ul class="roadmap" style="margin:8px 0 0;padding-left:20px">${ROADMAP.map(r=>`<li><b>${r[0]}</b>: ${r[1]}</li>`).join('')}</ul></div>`:''}
   <div class="card"><div class="eyebrow">Tyros setup for the app</div><ul style="margin:8px 0 0;padding-left:20px">
    <li>Split point <b>B2</b> (the B just below middle C), chord fingering <b>Fingered</b>.</li>
    <li><b>PART ON/OFF [LEFT]</b> on, so the app hears your left hand. Turn its volume down if you don't want to hear it.</li>
    <li>Results save automatically when you finish a run or a lesson.</li></ul></div>
  </div>`;
  if(!timer.running){timer.left=S.min*60}
  paintTimer();paintBand();
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curLesson=b.dataset.l;stopTimer();timer.left=0;save();renderLesson();scrollTo(0,0)});
  el.querySelectorAll('.progress span').forEach(s=>s.onclick=()=>{P.step=+s.dataset.s;stopTimer();save();renderLesson()});
  document.getElementById('tbtn').onclick=()=>{if(timer.running)stopTimer();else{if(timer.left<=0)timer.left=S.min*60;startTimer()}};
  document.getElementById('mbtn').onclick=toggleMetro;
  document.getElementById('bpm').oninput=e=>{metro.bpm=+e.target.value;document.getElementById('bpmv').textContent=metro.bpm+' bpm';store.set('bkc-bpm',metro.bpm)};
  document.getElementById('prev').onclick=()=>{P.step=Math.max(0,i-1);stopTimer();save();renderLesson();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{if(!P.done.includes(i))P.done.push(i);stopTimer();
    if(i<L.steps.length-1){P.step=i+1}else{sendLessonDone(L);P.complete=true}
    save();renderLesson();scrollTo(0,0)};
}

/* ---------- chords tab ---------- */
const FAMS=[
 {t:'Key of C · the four everyday chords',d:'Most happy songs live here. Smooth shapes from Lesson 2.',k:['Cs','Gs','Ams','Fs']},
 {t:'A minor · the Jewish minor sound',d:'Am, Dm and E (major!). The backbone of countless niggunim.',k:['Amm','Dmm','Em']},
 {t:'Key of G · same pattern, moved',d:'G → D → Em → C works exactly like C → G → Am → F. Coming in Lesson 6.',k:['Gg','Dg','Emg','Cg']}
];
function renderChords(){const el=document.getElementById('tab-chords');
  el.innerHTML=FAMS.map(f=>`<div class="fam"><h2>${f.t}</h2><p>${f.d}</p>${diagramProg(f.k)}<div class="grid2">${f.k.map(k=>`<div class="card">${diagramChord(k)}</div>`).join('')}</div></div>`).join('')+`<div style="margin-top:12px">${LEGEND}</div>`}

/* ---------- fit tab ---------- */
const FITKEYS={
 C:{label:'Key of C',notes:['C','D','E','F','G','A','B'],chords:['Cs','Gs','Ams','Fs'],oct:4},
 Am:{label:'A minor',notes:['A','B','C','D','E','F','G#'],chords:['Amm','Dmm','Em'],oct:4},
 G:{label:'Key of G',notes:['G','A','B','C','D','E','F#'],chords:['Gg','Dg','Emg','Cg'],oct:4}
};
let fitKey='C',fitNote=null;
/* right-hand chord with the melody note on top (pinky) */
const mname=m=>NAMES[m%12]+(Math.floor(m/12)-1);
function topVoicing(k,mpc){const pcs=V[k].r.map(x=>midi(x[0])%12),mp=NAMES.indexOf(mpc);
  let top=60+mp;if(top<65)top+=12;
  const below=pcs.filter(p=>p!==mp).map(p=>{let n=top-1;while(n%12!==p)n--;return n}).sort((a,b)=>a-b);
  const mid=below[1],f2=(top-mid>=5)?2:3;
  let l=midi(V[k].l[0][0]);while(l>=below[0]-5)l-=12;while(l<36)l+=12;
  return {r:[[below[0],1],[mid,f2],[top,5]],l}}
function topMarks(k,mpc){const v=topVoicing(k,mpc);return [{n:mname(v.l),f:5,h:'l'},{n:mname(v.r[0][0]),f:1,h:'r'},{n:mname(v.r[1][0]),f:v.r[1][1],h:'r'},{n:mname(v.r[2][0]),f:5,h:'m'}]}
function topText(k,mpc){const v=topVoicing(k,mpc),s=m=>SP(pc(mname(m)));
  return `<b>Melody ${s(v.r[2][0])} on top with your pinky</b> (gold key). Under it, thumb on ${s(v.r[0][0])} and finger ${v.r[1][1]} on ${s(v.r[1][0])}. Left pinky on ${s(v.l)}.`}
function renderFit(){const el=document.getElementById('tab-fit');const F=FITKEYS[fitKey];
  let res='';
  if(fitNote){const hits=F.chords.filter(k=>V[k].r.some(x=>pc(x[0])===fitNote));
    res=hits.length?`<div class="fits">${hits.map(k=>{const isRoot=pc(V[k].l[0][0])===fitNote;return `<div class="card"><div class="fit"><div><h3>${nameOf(k)}</h3><div class="why">${fitNote} is ${isRoot?'the root, the strongest fit':'inside this chord'}</div></div><button class="btn small" data-hear="${k}">▶ Hear it</button></div><p class="hands" style="margin-top:8px">${topText(k,fitNote)}</p><div class="kb">${keyboard(topMarks(k,fitNote))}</div>${LEGEND}</div>`}).join('')}</div>`
     :`<div class="card" style="margin-top:14px"><h3>No chord in this family holds ${fitNote}</h3><p class="note">That usually means it's a passing note: keep the chord you're already on and let the melody walk through it.</p></div>`}
  el.innerHTML=`<div class="stack"><div><h2>Which chord goes with this melody note?</h2><p class="note" style="margin-top:6px">This is the skill that connects the melody you play by ear to the chords. On the strong beat (where you'd clap), the melody note is almost always one of the chord's three notes. Tap the note your melody is sitting on.</p></div>
   <div class="seg" role="group" aria-label="Key">${Object.keys(FITKEYS).map(k=>`<button data-k="${k}" aria-pressed="${k===fitKey}">${FITKEYS[k].label}</button>`).join('')}</div>
   <div class="notesel">${F.notes.map(n=>`<button data-n="${n}" aria-pressed="${n===fitNote}">${n.replace('#','♯')}</button>`).join('')}</div>
   ${res||'<p class="note">Try it: in the key of C, tap E. Both C and Am contain E, so either works. Your ear picks which sounds right for the song.</p>'}
   <div class="card"><div class="eyebrow">How to use this at the keyboard</div><ul style="margin:8px 0 0;padding-left:20px"><li>Play the melody slowly with your right hand.</li><li>Stop on the first strong-beat note. Look it up here.</li><li>Try each suggested chord in your left hand. Keep the one your ear likes.</li><li>Move to the next strong beat. Write the chords above the words as you go.</li></ul></div></div>`;
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{fitKey=b.dataset.k;fitNote=null;renderFit()});
  el.querySelectorAll('.notesel button').forEach(b=>b.onclick=()=>{fitNote=b.dataset.n;const a=ac();if(a)tone(midi(fitNote+'5'),a.currentTime+.02,.8,.14);renderFit()});
  el.querySelectorAll('[data-hear]').forEach(b=>b.onclick=()=>{const a=ac();if(!a)return;const v=topVoicing(b.dataset.hear,fitNote),t=a.currentTime+.02;
    tone(v.l,t,1.6,.16);v.r.slice(0,2).forEach(x=>tone(x[0],t,1.6,.09));tone(v.r[2][0],t,1.6,.17)});
}

function renderSongs(){const el=document.getElementById('tab-songs');
  el.innerHTML=`<div class="stack"><div><h2>Songs</h2><p class="note" style="margin-top:6px">You already know these melodies by ear. Here you get the chords that go under them. Check each one against how your shul actually sings it; tunes vary from place to place.</p></div>
  <div class="card song"><div class="eyebrow">Four chords · Lessons 3–4</div><h3>Siman Tov u'Mazal Tov</h3><div class="flow"><span>Am</span><span>C</span><span>Dm</span><span>E</span></div>
   <p>A minor-key song. Charts usually write it in C♯m; here it's moved to A minor so it uses the shapes you know.</p>${SONG.siman()}</div>
  <div class="card song"><div class="eyebrow">Shul favorite · uses Lessons 1–3</div><h3>Hashivenu (Hanan Ben Ari)</h3><div class="flow"><span>Am</span><span>G</span><span>Dm</span><span>C</span><span>F</span></div>

  <div class="card"><div class="eyebrow">Chord families for Jewish music</div><ul style="margin:8px 0 0;padding-left:20px">
