  return ['solo','this trainer (any piano sound works)']}
function setupBox(sel){const f=setupFor(sel);if(!f||typeof SETUPS==='undefined')return '';const s=SETUPS.find(x=>x.id===f[0]);if(!s)return '';
  return `<div style="border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:4px 0 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center">
   <span style="font-weight:700">🎹 Tyros for ${f[1]}: ${s.title.replace(/^\d+ · /,'Setup '+(SETUPS.indexOf(s)+1)+' · ')}</span>
   <span style="flex:1 1 300px;font-size:14px">${SETUP_QUICK[s.id]||''}${f[2]?' · <b>Don\'t press [START]</b> on the Tyros: here the app is the band':''}</span>
   <button class="btn small" data-l="setups" data-suo="${s.id}">All steps ▸</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-suo]');if(b)store.set('su-open',b.dataset.suo)},true);
const tabsHTML=sel=>`<div class="lessons">${TRAINER_TABS.map(([id,n])=>`<button class="lchip" data-l="${id}" aria-pressed="${sel===id}">${n}</button>`).join('')}</div>`+setupBox(sel)+coachStrip(sel);
function render(){if(metro.on){clearInterval(metro.iv);metro.on=false}
  if(cur==='patterns')cur='pt';if(cur==='coach'){const app=document.getElementById('app');app.innerHTML=tabsHTML('coach')+coachHTML();app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});return}
  if(!['trainer','pt','th','rh','jam','inv','sc','ear','songs','setups'].includes(cur))cur='trainer';
  if(cur==='setups'){const app=document.getElementById('app');app.innerHTML=tabsHTML('setups')+setupsHTML();
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
    app.querySelectorAll('[data-su]').forEach(b=>b.onclick=()=>{store.set('su-open',b.dataset.su);render()});return}
  if(cur!=='jam'&&(JAM.state==='play'||JAM.state==='demo')){jamStop(true);JAM.state='idle'}clearTimeout(JAM.timer);
  if(cur==='jam'){const app=document.getElementById('app');app.innerHTML=tabsHTML('jam')+jamHTML();
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{jamStop(true);JAM.state='idle';cur=b.dataset.l;save();render();scrollTo(0,0)});
    const pk=(a,k,st)=>app.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{jamStop(true);JAM.state='idle';JAM[k]=b.dataset[a];store.set(st,JAM[k]);if(k!=='out')jamBuild();render()});
    pk('jg','groove','jam-groove');pk('jk','key','jam-key');pk('jr','role','jam-role');
    app.querySelectorAll('[data-jm]').forEach(b=>b.onclick=()=>{JAM.mem=b.dataset.jm==='1';store.set('jam-mem',JAM.mem);render()});
    pk('jout','out','jam-out');
    app.querySelectorAll('[data-jb]').forEach(b=>b.onclick=()=>{JAM.bpm[JAM.groove]=Math.max(36,Math.min(160,jamBpm()+(+b.dataset.jb)));store.set('jam-bpm',JAM.bpm);render()});
    app.querySelectorAll('[data-jv]').forEach(b=>b.onclick=()=>{JAM.vol=Math.max(.1,Math.min(1.5,+(JAM.vol+(+b.dataset.jv)/10).toFixed(1)));store.set('jam-vol',JAM.vol);if(JAM.master)JAM.master.gain.value=JAM.vol;render()});
    jamPaint();return}
  if(cur==='ear'){const app=document.getElementById('app');app.innerHTML=tabsHTML('ear')+earHTML();
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{EAR.stop();cur=b.dataset.l;save();render();scrollTo(0,0)});
    app.querySelectorAll('[data-earlv]').forEach(b=>b.onclick=()=>{EAR.lv=b.dataset.earlv;store.set('ear-lv',EAR.lv);EAR.stop();EAR.newRound();render()});
    EAR.paint();return}
  if(cur==='songs'){const app=document.getElementById('app');
    app.innerHTML=tabsHTML('songs')+(songsOpen()?`<div class="head"><div class="eyebrow">Trainer</div><h2>Song Trainer</h2><p>Your songs, as chord charts. Play them your way and tap Listen so Claude can hear how it's going.${songsReady()?'':' <span style="color:var(--muted)">Suggested after Two-Hand Trainer level 3, but jump in anytime.</span>'}</p></div>`+srHTML():
      `<div class="head"><div class="eyebrow">Trainer</div><h2>Song Trainer</h2><p>Whole songs from your sheet music, using the chords and hand skills from the other trainers.</p></div><article class="card"><h3>🔒 Locked</h3><p>Opens when <b>Two-Hand Trainer level 3</b> (right hand holds, left hand bass-chord) is all green. By then your hands can carry a song without stopping to think.</p></article>`);
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
    app.querySelectorAll('[data-srsong]').forEach(b=>b.onclick=()=>{SR.song=b.dataset.srsong;store.set('sr-song',SR.song);render()});
    srPaint();return}
  if(cur==='pt'||cur==='th'||cur==='rh'||cur==='sc'||cur==='inv'){const id=cur;const app=document.getElementById('app');
    app.innerHTML=tabsHTML(id)+dHTML(id);
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
    app.querySelectorAll('[data-dlv]').forEach(b=>b.onclick=()=>{DS[id].lv=b.dataset.dlv;store.set(DRILLS[id].store+'-lv',DS[id].lv);dBuild(id);render()});
    app.querySelectorAll('[data-dmem]').forEach(b=>b.onclick=()=>{DS[id].mem=b.dataset.dmem==='1';store.set(DRILLS[id].store+'-mem',DS[id].mem);render()});
    app.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{DRILLS[id].extraSet(b.dataset.dx);dBuild(id);render()});
    app.querySelectorAll('[data-dkey]').forEach(b=>b.onclick=()=>{DS[id].key=b.dataset.dkey;store.set(DRILLS[id].store+'-key',DS[id].key);dBuild(id);render()});
    dPaint(id);return}
  if(cur==='keys'){const app=document.getElementById('app');
    app.innerHTML=`<div class="lessons">${LESSONS.map((l,j)=>`<button class="lchip" data-l="${l.id}" aria-pressed="false">Lesson ${j+1}</button>`).join('')}<button class="lchip" data-l="trainer" aria-pressed="false">Chord Trainer</button></div>`+keyDrillHTML();
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
    app.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{KD.key=b.dataset.kd;store.set('kd-key',KD.key);render()});
    app.querySelectorAll('[data-kdmem]').forEach(b=>b.onclick=()=>{KD.mem=b.dataset.kdmem==='1';store.set('kd-mem',KD.mem);render()});return}
  if(cur==='trainer'){const app=document.getElementById('app');
    app.innerHTML=tabsHTML('trainer')+trainerHTML();
    app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
    const pick=(attr,key)=>app.querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>{TR[key]=b.dataset[attr];store.set('tr-'+key,TR[key]);TR.summary=null;trBuild();render()});
    pick('set','set');pick('hand','hand');pick('mode','mode');
    app.querySelectorAll('[data-trview]').forEach(b=>b.onclick=()=>{store.set('tr-view',b.dataset.trview);SR.run=null;render()});
    app.querySelectorAll('[data-srsong]').forEach(b=>b.onclick=()=>{SR.song=b.dataset.srsong;store.set('sr-song',SR.song);SR.run=null;render()});
    app.querySelectorAll('[data-srmode]').forEach(b=>b.onclick=()=>{SR.mode=b.dataset.srmode;store.set('sr-mode',SR.mode);SR.run=null;render()});
    app.querySelectorAll('[data-srb]').forEach(b=>b.onclick=()=>{SR.bpm[SR.song]=Math.max(30,Math.min(200,srTempo()+(+b.dataset.srb)));store.set('sr-bpm',SR.bpm);render()});
    trPaint();srPaint();return}
  const L=LESSONS.find(l=>l.id===cur)||LESSONS[0];const p=P(L.id);const i=Math.min(p.step,L.steps.length-1);const S=L.steps[i];const n=LESSONS.indexOf(L)+1;
  const app=document.getElementById('app');
  const chips=LESSONS.map((l,j)=>`<button class="lchip" data-l="${l.id}" aria-pressed="${l.id===L.id}">Lesson ${j+1}</button>`).join('')+`<button class="lchip" data-l="trainer" aria-pressed="false">Chord Trainer</button><button class="lchip" data-l="patterns" aria-pressed="false">Pattern Trainer</button>`+ROADMAP.map((r,j)=>`<button class="lchip locked" disabled>🔒 Lesson ${LESSONS.length+j+1}</button>`).join('');
  const xs=S.x?(Array.isArray(S.x)?S.x:[S.x]):[];const locked=()=>!!L.gate&&xs.some(k=>!isPassed(k));
  let extra='';
  if(S.x)extra+=(Array.isArray(S.x)?S.x:[S.x]).map(k=>exercise(EX[k])).join('<hr style="border:none;border-top:1px solid var(--rule);margin:4px 0">');
  if(S.metro)extra+=metroWidget();
  if(S.report)extra+=`<div class="check" id="rep">${(L.check||CHECK1).map((c,j)=>`<label><input type="checkbox" id="c${j}"> ${c}</label>`).join('')}
    <p style="margin:6px 0 0;font-weight:600">How did it feel?</p><div class="rate">${['Easy','OK','Hard'].map(r=>`<button class="btn small" data-r="${r}" aria-pressed="false">${r}</button>`).join('')}</div>
    <label for="notes" style="font-weight:600">Anything to tell Claude? (optional)</label><textarea id="notes" placeholder="e.g. my pinky keeps lifting, left hand is slower"></textarea>
    <button class="btn primary" id="send">Send to Claude</button></div>`;
  app.innerHTML=`<div class="lessons">${chips}</div>
   <div class="head"><div class="eyebrow">Lesson ${n}</div><h2>${L.title}</h2><p>${L.goal}</p><div class="prog">${L.steps.map((s,j)=>`<span data-s="${j}" title="${s.t}" class="${j===i?'cur':p.done.includes(j)?'done':''}"></span>`).join('')}</div></div>
   <article class="card"><div class="step">Step ${i+1} of ${L.steps.length}</div><h3>${S.t}</h3>${S.b}${extra}
    <div class="nav"><button class="btn" id="back" ${i===0?'disabled':''}>◀ Back</button>${i<L.steps.length-1?`<button class="btn primary" id="next" ${locked()?'disabled':''}>${locked()?'🔒 Pass this step first':'Next step ▶'}</button>`:''}</div></article>
   <article class="card"><h3>Coming next</h3><p style="color:var(--muted);font-size:15px">Claude opens each lesson after reading how the last one went.</p><ol class="road">${ROADMAP.map((r,j)=>`<li><span class="n">${LESSONS.length+j+1}</span><span>${r[0]}</span><span class="d">${r[1]}</span></li>`).join('')}</ol></article>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cur=b.dataset.l;save();render();scrollTo(0,0)});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{p.step=+b.dataset.s;save();render()});
  const bk=document.getElementById('back');if(bk)bk.onclick=()=>{p.step=Math.max(0,i-1);save();render();scrollTo(0,0)};
  document.onexpass&&document.removeEventListener('ex-pass',document.onexpass);document.onexpass=()=>{const b=document.getElementById('next');if(b&&!locked()){b.disabled=false;b.textContent='Next step ▶'}};document.addEventListener('ex-pass',document.onexpass);
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{if(!p.done.includes(i))p.done.push(i);p.step=i+1;save();render();scrollTo(0,0)};
  if(S.report){let rate='';app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rate=b.dataset.r;app.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    document.getElementById('send').onclick=()=>{const ticks=(L.check||CHECK1).map((c,j)=>(document.getElementById('c'+j).checked?'✓ ':'✗ ')+c).join('; ');
      if(!p.done.includes(i))p.done.push(i);save();sendReport(`Lesson ${n} · ${L.title} · felt: ${rate||'not picked'} · ${ticks}${document.getElementById('notes').value.trim()?' · notes: '+document.getElementById('notes').value.trim():''}`)}}
}
render();paintConn();
</script>
